    // 実績を解除する（見込み計算では何もしない）
    ach(id) {
      if (!dry) unlockAch(id);
    },
    // 招き猫の追加効果「金運」：隣の金庫・換金機の倍率 +1
    catBank() {
      return (m.type === 'vault' || m.type === 'exchange') && modOn('cat') ? countAdjType(m.x, m.y, 'cat') : 0;
    },
    // 「×base」の実際の倍率（強化・改造★・隣の増幅器は増えた分に掛かる、冷却塔と金運の招き猫は+1）
    eff(base) {
      return 1 + (base - 1) * tuneMul(m.type) * starMul(m) * ampMul(m) + countAdjType(m.x, m.y, 'cooler') + this.catBank();
    },
    add(n) {
      if (n <= 0) return;
      n *= tuneMul(m.type) * starMul(m) * ampMul(m);
      item.value += n;
      capValue(item);
      item.steps = (item.steps || 0) + 1; // 品評台が数える
      if (dry) return;
      item.pop = 1;
      fx('#7fd6ff', false);
      addText(pos.x, pos.y - 14, '+' + fmt(n), '#7fd6ff', 14);
      Sfx.add(item.steps);
      checkUnit(item, pos);
    },
    // noCata: 触媒を使わない（急冷槽は自分で触媒を処理する）
    mul(base, jackpot, noCata) {
      let f = this.eff(base);
      // 「炉」の機械はアイテムを温める（隣のふいご1台につき +1）。冷却塔の隣だと熱を出さない（研究「断熱」で出す）
      // ふいごの追加効果「送風」：炉でなくても、隣にふいごがある「×」の機械は熱を出す
      const bellows = countAdjType(m.x, m.y, 'bellows');
      if (MACHINES[m.type].hot) {
        if (!countAdjType(m.x, m.y, 'cooler') || modOn('cooler')) item.heat = (item.heat || 0) + 1 + bellows;
      } else if (bellows && modOn('bellows') && MACHINES[m.type].kind === 'mult' && m.type !== 'quench') {
        item.heat = (item.heat || 0) + bellows;
      }
      // 触媒槽：次の「×」がもう1回かかる
      const cata = !noCata && item.cata > 0 && f > 1;
      if (cata) f *= useCatalyst(item, f);
      item.value *= f;
      capValue(item);
      item.steps = (item.steps || 0) + 1;
      if (dry) return;
      item.pop = 1.4;
      if (cata) {
        addText(pos.x, pos.y - 40, '触媒！', '#a6f06a', 16, true);
        addRing(pos.x, pos.y, '#a6f06a', 1.6);
        burst(pos.x, pos.y, '#a6f06a', 14);
      }
      if (m.type === 'vault' && f >= 5) unlockAch('vault5');
      if (this.catBank() > 0) unlockAch('x_cat_bank');
      if (jackpot) {
        R.dayStats.jackpots = (R.dayStats.jackpots || 0) + 1;
        if (cata) unlockAch('jackpot100');
        fx('#ffd447', true);
        addText(pos.x, pos.y - 20, '大当たり ×' + fmtMult(f), '#ffd447', 24, true);
        Sfx.jackpot();
        burst(pos.x, pos.y, '#ffd447', 32);
        addRing(pos.x, pos.y, '#ffd447', 2);
        G.shake = Math.max(G.shake, 7);
        flashScreen(0.35, '#ffd447');
        G.hitstop = Math.max(G.hitstop, 0.08);
      } else {
        fx('#ff8a5c', f >= 4);
        addText(pos.x, pos.y - 16, '×' + fmtMult(f), '#ff8a5c', 15 + Math.min(10, f * 1.3), f >= 3);
        Sfx.mult(item.steps);
        if (f >= 4) burst(pos.x, pos.y, '#ff8a5c', 8);
      }
      checkUnit(item, pos);
    },
    // 錬金釜（ベルト型なので1個につき1回）。金なら×3。錬金術師がいればランクが上がるたびに ×(1+2×台数)
    // 追加効果：錬金釜「錬金の火」＝ランクが上がるたび熱+2 ／ 錬金術師「大錬成」＝金の ×2 にも錬金術師が乗る
    transmute() {
      const a = countPlaced('alchemist');
      if (item.tier >= 3) return this.mul(3 + (modOn('alchemist') ? 2 * a : 0));
      this.rankUp();
      if (modOn('transmuter')) item.heat = (item.heat || 0) + 2;
      if (a > 0) this.boost(1 + 2 * a, '錬成', '#c9a2ff');
    },
    // 溶解炉：素材ランクを1つ下げる
    rankDown() {
      if (item.tier >= 3 && !dry) unlockAch('melt_gold');
      item.tier = Math.max(0, item.tier - 1);
      if (dry) return;
      addText(pos.x, pos.y - 30, TIERS[item.tier].name + 'に', TIERS[item.tier].color, 13, true);
    },
    // 隣の「炉」の機械の数（双子炉以外。双子炉の追加効果「三つ子」）
    adjHot() {
      return adjMachineList(m.x, m.y).filter((o) => !offline(o) && o.type !== 'twin' && MACHINES[o.type].hot).length;
    },
    // 倍率をそのまま掛ける（改良・改造★・冷却塔は乗らない）。錬金術師など「別の機械の力」で掛けるとき
    boost(f, label, color) {
      item.value *= f;
      capValue(item);
      item.steps = (item.steps || 0) + 1;
      if (dry) return;
      if (f >= 3) unlockAch('alchemy3');
      item.pop = 1.4;
      fx(color, true);
      addText(pos.x, pos.y - 30, `${label} ×${fmtMult(f)}`, color, 17, true);
      burst(pos.x, pos.y, color, 10);
      Sfx.mult(item.steps);
      checkUnit(item, pos);
    },
    // バーナー：熱だけを足す（label があれば「ハズレ 熱+1」のように出す。宝くじ機の追加効果「残念賞」）
    heatUp(n, label) {
      item.heat = (item.heat || 0) + n;
      if (label) item.lotHeat = true; // 実績「ハズレも熱い」用
      if (dry) return;
      item.pop = 1.2;
      fx('#ff7a3d', false);
      addText(pos.x, pos.y - 16, `${label ? label + ' ' : ''}熱+${n}`, '#ff9a5c', label ? 12 : 14, true);
      if (!label) Sfx.whoosh();
    },
    // この機械がこのアイテムに初めて当たったか（換金機：1台につき1個1回）
    once() {
      if (item.onceBy && item.onceBy[m.uid]) return false;
      item.onceBy = { ...item.onceBy, [m.uid]: true };
      return true;
    },
    // コインを払う（見込み計算では実際には減らさず、払った分だけ数える）
    spend(n) {
      const left = R.coins - (dry ? R.drySpent || 0 : 0);
      if (left < n) return false;
      if (dry) {
        R.drySpent = (R.drySpent || 0) + n;
        return true;
      }
      R.coins -= n;
      R.dayStats.coins -= n;
      R.dayStats.spent += n; // 換金機のキャッシュバック・実績「散財」
      if (R.dayStats.spent >= 30) unlockAch('spend30');
      addText(mx, m.y * TILE + 6, '-' + n + '枚', '#ffb347', 13, true);
      G.dirty = true;
      return true;
    },
    // この機械がこのアイテムに当たった回数（今回を含む。熟練工）
    hitCount() {
      const n = ((item.hits && item.hits[m.uid]) || 0) + 1;
      item.hits = { ...item.hits, [m.uid]: n }; // 分身と共有しないよう作り直す
      if (!dry && n >= 6) unlockAch('artisan6');
      return n;
    },
    // 熟練工の数え始めを進める追加効果：蓄電池「余剰電力」（隣の蓄電池1台につき+1）／熟練工「金の匠」（金なら+2）
    hitBonus() {
      return (modOn('battery') ? countAdjType(m.x, m.y, 'battery') : 0) + (modOn('artisan') && item.tier === 3 ? 2 : 0);
    },
    // N回ごとの機械：カウンターを w 進めて、今回で必要回数をまたいだか（料金所の「通行税」は銀・金を2個ぶんに数える）
    every(n, w = 1) {
      const ch = chargeOf(m);
      m.counter += w;
      if (m.counter < ch) return false;
      m.counter -= ch;
      m.fired = (m.fired || 0) + 1;
      return true;
    },
    // 今の持ちコイン（見込み計算では換金機が払った分を引く）
    coinsNow() {
      return R.coins - (dry ? R.drySpent || 0 : 0);
    },
    adjType(type) {
      return countAdjType(m.x, m.y, type);
    },
    // 隣の機械の種類数（プリズム）
    adjKinds() {
      return new Set(adjMachineList(m.x, m.y).filter((o) => !offline(o)).map((o) => o.type)).size;
    },
    // 急冷槽：熱を倍率に変えて（quenchMul：熱の3乗で伸びる）、熱を0に
    // 追加効果「余熱」：急冷しても熱の半分が残る
    // 触媒は「もう1回急冷する」：1回目で熱を使い切るので、余熱がなければ2回目は効かない（2乗にはならない）
    quench() {
      const h = item.heat;
      const keep = (x) => (modOn('quench') ? Math.floor(x / 2) : 0);
      let f = quenchMul(h);
      let rest = keep(h);
      if (item.cata > 0) {
        f *= useCatalyst(item, quenchMul(rest));
        rest = keep(rest);
      }
      item.heat = rest;
      if (!dry) {
        if (h >= 10) unlockAch('quench10');
        if (h >= 25) unlockAch('quench25');
        if (f >= 1000) unlockAch('quench1000');
        if (item.zapHeat) unlockAch('x_zap_heat');
        if (item.lotHeat) unlockAch('x_lot_heat');
        addText(pos.x, pos.y - 34, `急冷！ 熱${h}`, '#9fd8ff', 16, true);
        burst(pos.x, pos.y, '#e8f6ff', 10 + Math.min(30, h * 2));
        addRing(pos.x, pos.y, '#9fd8ff', 1 + Math.min(1.5, h / 8));
        Sfx.whoosh();
        if (h >= 8) {
          G.shake = Math.max(G.shake, 4 + Math.min(8, h / 2));
          flashScreen(0.2, '#bfe6ff');
        }
      }
      this.mul(f, false, true);
    },
    // 分裂ゲート：価値半分の2個に分ける（1個のアイテムは1回だけ。分かれた2個はもう分裂しない）
    split() {
      if (item.split) return this.none('分裂済');
      if (pool.length >= MAX_ITEMS) return this.none('満杯');
      item.split = true;
      item.value *= modOn('splitter') ? 0.6 : 0.5; // 追加効果「厚切り」
      item.twin = true; // 分身（共鳴器が見る）
      const cl = { ...item, uid: dry ? 0 : G.uid++, p: item.p - 0.32, pop: 1.5, seed: Math.random(), trail: [] };
      pool.push(cl);
      if (born) born.push(cl);
      if (dry) return;
      R.dayStats.split++;
      item.pop = 1.5;
      fx('#5fd4f5', true);
      addText(pos.x, pos.y - 18, '分裂！', '#5fd4f5', 16, true);
      Sfx.split();
      burst(pos.x, pos.y, '#5fd4f5', 12);
    },
    // 触媒槽：次の「×」がもう1回かかる
    catalyze(n = 1) {
      item.cata = (item.cata || 0) + n;
      if (dry) return;
      item.pop = 1.2;
      fx('#a6f06a', false);
      addText(pos.x, pos.y - 14, '触媒', '#a6f06a', 13, true);
      Sfx.cata();
    },
    rankUp() {
      item.tier = Math.min(3, item.tier + 1);
      if (dry) return;
      const c = TIERS[item.tier].color;
      item.pop = 1.3;
      fx(c, false);
      addText(pos.x, pos.y - 16, TIERS[item.tier].name + '！', c, 16, true);
      Sfx.rank(item.tier);
      burst(pos.x, pos.y, c, 8);
    },
    coin(n) {
      if (dry) return;
      R.coins += n;
      R.dayStats.coins += n;
      addText(mx, m.y * TILE + 6, '+' + n + '枚', '#ffd447', 15, true);
      Sfx.coin();
      G.dirty = true;
    },
    // 複製（見込み計算でも数える）
    dup() {
      if (pool.length >= MAX_ITEMS) {
        if (!dry) addText(pos.x, pos.y - 14, '満杯', '#6b7385', 11);
        return;
      }
      item.twin = true;
      const cl = { ...item, uid: dry ? 0 : G.uid++, p: item.p - 0.32, pop: 1.5, seed: Math.random(), trail: [] };
      pool.push(cl);
      if (dry) return;
      R.dayStats.dup++;
      fx('#6fe3a5', true);
      addText(pos.x, pos.y - 18, '複製！', '#6fe3a5', 16, true);
      Sfx.dup();
      burst(pos.x, pos.y, '#6fe3a5', 12);
    },
    destroy() {
      item.alive = false;
      if (dry) return;
      R.dayStats.destroyed++;
      addText(pos.x, pos.y - 14, '消滅…', '#ff6b6b', 15, true);
      Sfx.destroy();
      burst(pos.x, pos.y, '#c0303c', 24);
      addRing(pos.x, pos.y, '#c0303c', 1.4);
    },
    none(t) {
      if (dry || !t) return;
      addText(pos.x, pos.y - 12, t, '#6b7385', 11);
    },
    // 還流ポンプ：ポンプ1台につき1回（別のポンプならもう一度戻せる）
    // 同じアイテムを巻き戻すたびに距離が短くなる（2回目は半分、3回目は3分の1…）。ポンプを並べても周回数が倍々にならない
    rewind(dist) {
      item.looped ||= {};
      if (item.looped[m.uid]) return this.none('還流済');
      item.looped = { ...item.looped, [m.uid]: true };
      const n = Math.ceil(dist / Object.keys(item.looped).length);
      const np = Math.max(0, item.p - n);
      item.p = np;
      item.last = Math.floor(np);
      if (dry) return;
      const to = itemPos(item);
      addBeam(pos.x, pos.y, to.x, to.y, '#4fd1c5', true);
      addRing(pos.x, pos.y, '#4fd1c5', 1);
      addRing(to.x, to.y, '#4fd1c5', 1.6);
      addText(to.x, to.y - 18, '還流！', '#4fd1c5', 18, true);
      Sfx.whoosh();
      burst(to.x, to.y, '#4fd1c5', 14);
      item.pop = 1.5;
      item.trail = [];
    },
    // 落雷塔：ベルト上の全アイテムに雷。アイテムごとに n回目の雷は ×(1 + k/n)
    // （何回でも効くが1発ずつ伸びが緩くなる。合計は浴びた回数の k乗くらい）
    // アイテムが多いほど落雷が増えて全員が育つが、2倍にしても指数的には爆発しない
    // heat: 追加効果「帯電」。熱を持っていないアイテムにだけ、この熱を付ける（雷の回数ぶん熱が増えると、急冷が桁違いに伸びる）
    strike(k, heat = 0) {
      const targets = pool.filter((o) => o.alive);
      for (const o of targets) {
        o.zap = (o.zap || 0) + 1;
        o.value *= 1 + k / o.zap;
        if (heat && !o.heat) {
          o.heat = heat;
          o.zapHeat = true; // 実績「雷で沸かす」用
        }
        capValue(o);
      }
      if (dry) return;
      if (targets.length >= 50) unlockAch('storm50');
      if (targets.length >= 100) unlockAch('items100');
      if (targets.some((o) => o.zap >= 12)) unlockAch('zap12');
      let bolts = 0;
      let shown = 0;
      for (const o of targets) {
        const op = itemPos(o);
        if (bolts++ < 14) addBolt(mx, my, op.x, op.y);
        if (shown++ < 40) addText(op.x, op.y - 16, '×' + fmtMult(Math.round((1 + k / o.zap) * 100) / 100), '#fff27a', 14, true);
        o.pop = 1.4;
        checkUnit(o, op);
      }
      addText(mx, my - 34, `大落雷！ ${targets.length}個`, '#fff27a', 22, true);
      addRing(mx, my, '#fff27a', 3);
      burst(mx, my, '#fff27a', 30);
      Sfx.thunder();
      flashScreen(0.45, '#fff6b0');
      G.shake = Math.max(G.shake, 10);
      G.hitstop = Math.max(G.hitstop, 0.12);
      G.zoom = Math.max(G.zoom, 0.7);
    },
  };
}

// 価値の単位（万・億・兆…）が上がった瞬間の演出
function checkUnit(item, pos) {
  const R = G.run;
  const u = unitIndex(item.value);
  if (u <= (item.unit || 0)) return;
  item.unit = u;
  ['unit_man', 'unit_oku', 'unit_cho', 'unit_kei', 'unit_gai'].forEach((id, i) => {
    if (u >= i + 1) unlockAch(id);
  });
  const name = u < JP_UNITS.length ? JP_UNITS[u] : '∞';
  const color = UNIT_COLORS[Math.min(u, UNIT_COLORS.length - 1)];
  if (u > R.bestUnit) {
    // このランで初めての単位 → 大演出
    R.bestUnit = u;
    UI.banner(`「${name}」突破！`, 'unit');
    flashScreen(0.55, color);
    G.hitstop = Math.max(G.hitstop, 0.16);
    G.shake = Math.max(G.shake, 10);
    G.zoom = 1;
    addRing(pos.x, pos.y, color, 3);
    addRing(pos.x, pos.y, '#ffffff', 2);
    burst(pos.x, pos.y, color, 40);
    Sfx.unitBig(u);
  } else if (u >= R.bestUnit - 1) {
    addText(pos.x, pos.y - 32, `${name}到達`, color, 13 + u, true);
    addRing(pos.x, pos.y, color, 1.2);
    Sfx.unit(u);
  }
}

// 出荷時のランク倍率
function shipMulOf(item) {
  return TIERS[item.tier].ship;
}

function shipItem(item) {
  const R = G.run;
  item.alive = false;
  R.shippedCount = (R.shippedCount || 0) + 1;
  const e = R.path[R.path.length - 1];
  const ex = (e[0] + 0.5) * TILE;
  const ey = (e[1] + 0.5) * TILE;
  if (R.boss && R.boss.id === 'inspect' && R.shippedCount % 4 === 0) {
    addText(ex, ey - 26, '抜き取り', '#ff8fa3', 15, true);
    Sfx.destroy();
    return;
  }
  const t = TIERS[item.tier];
  const shipMul = shipMulOf(item);
  const v = Math.min(1e300, item.value * shipMul * prodMul());
  R.dayScore = Math.min(1e300, R.dayScore + v);
  R.phaseScore = Math.min(1e300, R.phaseScore + v);
  R.stats.totalShipped = Math.min(1e300, R.stats.totalShipped + v);
  R.dayStats.best = Math.max(R.dayStats.best, v);
  R.stats.bestItem = Math.max(R.stats.bestItem, v);

  // 連続出荷コンボ
  R.combo = R.t - R.lastShipT < 1.1 ? R.combo + 1 : 1;
  R.lastShipT = R.t;
  R.dayStats.maxCombo = Math.max(R.dayStats.maxCombo, R.combo);
  if (R.combo >= 40) unlockAch('combo40');
  if (item.tier === 3) unlockAch('gold_ship');
  if (item.tier === 3 && v >= 1e8) unlockAch('gold_oku');
  if (item.tier === 0 && v >= 1e6) unlockAch('stone_man');

  const mag = Math.log10(v + 1);
  const ucol = UNIT_COLORS[Math.min(unitIndex(v), UNIT_COLORS.length - 1)];
  addText(ex, ey - 26, '+' + fmt(v), shipMul > 1 ? t.color : ucol, Math.min(32, 15 + mag * 2.5), true);
  if (shipMul > 1) addText(ex, ey - 50, t.name + ' ×' + shipMul, t.color, 12);
  if (R.combo >= 5 && R.combo % 5 === 0) {
    addText(ex, ey - 80, `${R.combo}連続出荷！`, '#7fd6ff', Math.min(24, 13 + R.combo / 4), true);
  }
  Sfx.ship(mag, R.combo);
  G.shipPulse = 1;
  burst(ex, ey, t.color, 6 + Math.min(24, Math.floor(mag * 3)));
  addRing(ex, ey, R.fever ? '#ffd447' : t.color, 1 + Math.min(1.5, mag / 6));
  const ratio = v / R.quota;
  if (ratio > 0.06) G.shake = Math.min(16, G.shake + 2 + ratio * 12);
  if (ratio > 0.25) G.zoom = Math.max(G.zoom, 0.6);

  if (!R.quotaHit && R.phaseScore >= R.quota) {
    R.quotaHit = true;
    R.fever = true;
    UI.banner(R.hi ? 'ハイスコア 自己ベスト更新！' : `第${R.phase}期 納期達成！`);
    Sfx.quota();
    flashScreen(0.7, '#ffd447');
    G.hitstop = Math.max(G.hitstop, 0.2);
    G.shake = Math.max(G.shake, 12);
    G.zoom = 1;
    confetti();
    for (let i = 0; i < 4; i++) burst(ex, ey, ['#ffd447', '#ff7a59', '#6fe3a5', '#7fd6ff'][i], 18);
    addRing(ex, ey, '#ffd447', 4);
  }
  if (R.quotaHit) {
    // ノルマの2倍・4倍…ごとに超過ボーナス+1枚
    const lv = Math.min(5, Math.floor(Math.log2(R.phaseScore / R.quota)));
    if (lv > R.overLevel) {
      R.overLevel = lv;
      addText(ex, ey - 104, `ノルマ×${Math.pow(2, lv)}！ ボーナス+1枚`, '#ffd447', 17, true);
      Sfx.milestone(lv);
      flashScreen(0.25, '#ffd447');
      addRing(ex, ey, '#ffd447', 2.5);
    }
  }
}

// 1日の終わり。その期の合計がノルマに届いていれば納期達成（次の日から次の期）。納期の日に届いていなければ解雇。
// どちらでもなければ、同じ期のまま次の日へ
function endDay() {
  const R = G.run;
  if (R.hi) return endHiDay();
  const cleared = R.phaseScore >= R.quota;
  const daysLeft = R.deadline - R.day; // 納期まで残り何日あるか（今日は入れない）
  if (!cleared && daysLeft <= 0) {
    G.state = 'over';
    UI.banner('納期に間に合わず…', 'bad');
    Sfx.fail();
    G.dirty = true;
    setTimeout(() => endRun('fail'), 1300);
    return;
  }
  const lev = R.lev || 0;
  const coinsAtEnd = R.coins; // 稼働が終わった時点の持ちコイン
  // 毎日の報酬：基本 + 利息 + 貯金箱 + キャッシュバック
  const base = R.boss ? 6 : 4;
  const interest = Math.min(R.interestCap, Math.floor(R.coins / 5));
  const piggy = countPlaced('piggy') * Math.floor(R.coins / 10); // 貯金箱（上限なし）
  const cashback = modOn('exchange') ? Math.floor((R.dayStats.spent || 0) / 2) : 0; // 換金機「キャッシュバック」
  const dayPts = DAY_PATENT;
  R.stats.patentPts += dayPts;
  // 納期達成の報酬：基本 + 超過ボーナス + 前倒しボーナス。レバレッジは基本と超過に +50%/Lv
  let clear = null;
  if (cleared) {
    const ratio = R.phaseScore / R.quota;
    const over = Math.max(0, Math.min(5, Math.floor(Math.log2(ratio))));
    const bonus = PHASE_COIN_BASE + PHASE_COIN_STEP * R.phase;
    const early = EARLY_COIN * daysLeft;
    const levBonus = Math.round((bonus + over) * (levCoinMul(lev) - 1));
    const pts = PHASE_PATENT * R.phase * levPatentMul(lev);
    clear = { phase: R.phase, ratio, over, bonus, early, daysLeft, levBonus, pts, oneDay: R.day === R.phaseStartDay };
    R.coins += bonus + over + early + levBonus;
    R.stats.patentPts += pts;
    R.stats.levSum += lev;
    R.stats.levMin = Math.min(R.stats.levMin, lev);
    R.stats.levMax = Math.max(R.stats.levMax, lev);
    R.stats.phasesCleared = R.phase;
    R.stats.bestRatio = Math.max(R.stats.bestRatio, ratio);
  }
  R.coins += base + interest + piggy + cashback;
  R.lastReward = { base, interest, piggy, cashback, lev, dayPts, clear, daysLeft, need: Math.max(0, R.quota - R.phaseScore) };
  R.stats.days = R.day;
  R.stats.bestDay = Math.max(R.stats.bestDay, R.dayScore);
  R.lastReward.records = recordDay(R, clear);
  checkDayAchievements(clear, coinsAtEnd);
  R.rewards = rollRewards(!!clear);
  G.state = 'result';
  G.dirty = true;
  const firstWin = cleared && R.phase === PHASES && !R.victory;
  if (firstWin) R.victory = true;
  UI.showResult(firstWin);
}

// ---------- ハイスコアモード（完走のあと） ----------
// ノルマはなく、HISCORE_DAYS 日のあいだに出荷した合計がハイスコアになる。落ちることはない
// 画面のノルマの欄には、これまでの自己ベストを出す（超えると「自己ベスト更新」の演出）
function startHiscore() {
  const R = G.run;
  R.hi = { startDay: R.day + 1, endDay: R.day + HISCORE_DAYS, best: G.meta.best.hiscore || 0 };
  R.phaseScore = 0;
  R.deadline = R.hi.endDay;
  // 自己ベストがまだないときは、超える目標もないので演出は出さない
  R.quotaBase = R.hi.best > 0 ? R.hi.best : Infinity;
  R.quota = R.quotaBase;
  R.lev = 0;
  R.phaseFresh = false;
}
function endHiDay() {
  const R = G.run;
  const coinsAtEnd = R.coins;
  const base = R.boss ? 6 : 4;
  const interest = Math.min(R.interestCap, Math.floor(R.coins / 5));
  const piggy = countPlaced('piggy') * Math.floor(R.coins / 10);
  const cashback = modOn('exchange') ? Math.floor((R.dayStats.spent || 0) / 2) : 0;
  const dayPts = DAY_PATENT;
  R.stats.patentPts += dayPts;
  R.coins += base + interest + piggy + cashback;
  const daysLeft = R.hi.endDay - R.day;
  const done = daysLeft <= 0;
  R.hi.total = R.phaseScore;
  // 最後の日：ハイスコアを記録して、桁に応じた特許（1兆を超えたぶん、1桁につき1）
  let bonus = 0;
  if (done) {
    bonus = Math.max(0, Math.floor(Math.log10(Math.max(1, R.phaseScore))) - HISCORE_PATENT_FROM);
    R.stats.bonusPatents += bonus;
    R.hi.done = true;
    R.hi.bonus = bonus;
    R.hi.newBest = !devOn() && R.phaseScore > (G.meta.best.hiscore || 0);
    bumpBest('hiscore', R.phaseScore);
    checkHiAchievements(R.phaseScore);
  }
  R.lastReward = { base, interest, piggy, cashback, lev: 0, dayPts, clear: null, daysLeft, need: 0, hi: true };
  R.stats.days = R.day;
  R.stats.bestDay = Math.max(R.stats.bestDay, R.dayScore);
  R.lastReward.records = recordDay(R, null);
  checkDayAchievements(null, coinsAtEnd);
  R.rewards = done ? [] : rollRewards(false);
  G.state = 'result';
  G.dirty = true;
  UI.showResult(false);
}
function checkHiAchievements(total) {
  if (devOn()) return;
  unlockAch('endless15');
  if (total >= 1e16) unlockAch('end8');
  if (total >= 1e24) unlockAch('end10');
}

// 1日の終わりに見る実績。clear は、今日で納期を達成したときの内容（達成していなければ null）
function checkDayAchievements(clear, coinsAtEnd) {
  const R = G.run;
  const ds = R.dayStats;
  const lev = R.lev || 0;
  if (clear) {
    unlockAch('first_day');
    if (clear.phase >= 2) unlockAch('day6');
    if (clear.phase === PHASES) {
      unlockAch('win');

      if (R.stats.levMin >= 1) unlockAch('lev_all');
      if (R.stats.levSum >= 10) unlockAch('lev_sum');
      if ((G.meta.wins || 0) + 1 >= 3) unlockAch('wins3');
      if (R.day <= PHASES) unlockAch('early_all');
      if (R.day <= 15) unlockAch('fast_win');
      if (lev >= 1) unlockAch('lev_end');
    }
    if (clear.phase >= 4) unlockAch('end4');
    if (clear.phase >= 5) unlockAch('end6');
    if (clear.phase >= 4 && !Object.values(researchStore()).some((v) => v > 0)) unlockAch('win_nores');
    if (clear.oneDay) unlockAch('early1');
    // レバレッジ
    if (lev >= 1) unlockAch('lev1');
    if (lev >= 3) unlockAch('lev3');
    if (lev >= 5) unlockAch('lev5');
    if (R.boss && lev >= 2) unlockAch('lev_boss');
    if (clear.ratio < 1.1) unlockAch('narrow');
    if (clear.phase >= 2 && placedCount() <= 3) unlockAch('mini3');
    if (clear.phase >= 2 && coinsAtEnd === 0) unlockAch('broke');
  }
  // 記録
  if (R.dayScore >= R.quota * 100) unlockAch('over100');
  if (R.dayScore >= R.quota * 10000) unlockAch('over10000');
  if (R.dayScore >= 1e12) unlockAch('score_cho');
  if (R.boardCap >= 10) unlockAch('slots10');
  if (R.boardCap >= 13) unlockAch('slots13');
  if (R.coins >= 100) unlockAch('rich100');
  if (R.coins >= 250) unlockAch('rich250');
  if (ds.dup + ds.split >= 100) unlockAch('swarm100');
  if ((ds.jackpots || 0) >= 30) unlockAch('jackpot30');
  if (clear && R.boss && !G.meta.bossCleared.includes(R.boss.id)) {
    G.meta.bossCleared.push(R.boss.id);
    saveMeta();
  }
  if (BOSS_RULES.every((b) => G.meta.bossCleared.includes(b.id))) unlockAch('boss_all');
}

// 稼働開始のときに見る実績（盤面の並べ方）
function checkStartAchievements() {
  const ms = placedMachines().filter((m) => !offline(m));
  const adj = (m, type) => countAdjType(m.x, m.y, type);
  for (const m of ms) {
    if (m.type === 'twin' && adj(m, 'twin') > 0) unlockAch('twin_pair');
    if (m.type === 'mason' && adj(m, 'sieve') >= 2) unlockAch('mason2');
    if (m.type === 'lottery' && adj(m, 'cat') >= 3) unlockAch('cats3');
  }
  if (ms.filter((m) => m.type === 'thunder').length >= 2) unlockAch('thunder2');
  // 追加効果を研究した機械を動かす
  const mods = new Set(ms.filter((m) => modOn(m.type)).map((m) => m.type));
  if (mods.size >= 1) unlockAch('x_first');
  if (mods.size >= 3) unlockAch('x_three');
}
// 研究を進めたときに見る実績（テストモードの砂場では解除しない）
function checkResearchAchievements() {
  if (devOn()) return;
  const res = G.meta.research;
  const total = RESEARCH.reduce((s, r) => s + (res[r.id] || 0), 0);
  if (total >= 5) unlockAch('res5');
  if (total >= 40) unlockAch('res25');
  if (RESEARCH.filter((r) => r.kind === 'mod' && res[r.id] > 0).length >= 5) unlockAch('mods10');
  if (RESEARCH_TABS.some((t) => t.id !== 'gen' && tierOpen(t.id, 3))) unlockAch('branch_top');
}

// ---------- 日報ボーナス（日が終わるたびに3つから1つ選ぶ。納期を達成した日は中身が豪華になる） ----------
const REWARD_TYPES = [
  { id: 'coins', w: 3, ok: () => true },
  { id: 'machine', w: 3, ok: () => true },
  { id: 'kit', w: 3, ok: () => placedCount() + G.run.tray.length > 0 },
  { id: 'slot', w: 1, ok: (R) => R.day >= 3 },
  { id: 'patent', w: 1.5, ok: () => true },
  { id: 'quota', w: 1.5, ok: (R) => !R.hi },
  { id: 'shop', w: 2, ok: () => true },
  { id: 'reroll', w: 2, ok: () => true },
];
function rollRewards(big) {
  const R = G.run;
  const n = 3 + rlv('reward');
  const pool = REWARD_TYPES.filter((t) => t.ok(R));
  const out = [];
  while (out.length < n && pool.length) {
    const total = pool.reduce((s, t) => s + t.w, 0);
    let r = Math.random() * total;
    let i = 0;
    for (; i < pool.length - 1; i++) {
      r -= pool[i].w;
      if (r <= 0) break;
    }
    const t = pool.splice(i, 1)[0];
    // n: 数（コインの枚数、キットの個数、特許、ショップの品数、リロールの回数）。納期を達成した日は多い
    const rw = { id: t.id, big: !!big };
    if (t.id === 'coins') rw.n = (4 + R.day) * (big ? 2 : 1);
    if (t.id === 'kit') rw.n = big ? 2 : 1;
    if (t.id === 'patent') rw.n = big ? 4 : 2;
    if (t.id === 'shop') rw.n = big ? 3 : 2;
    if (t.id === 'reroll') rw.n = big ? 5 : 3;
    if (t.id === 'machine') {
      // 相性のいい機械が出やすい。納期を達成した日は、レアの機械（なければアンコモン以上）
      const pool2 = Object.keys(MACHINES).filter((k) => isUnlocked(k) && MACHINES[k].rarity >= 2);
      const rare = pool2.filter((k) => MACHINES[k].rarity >= 3);
      rw.type = weightedPick(big && rare.length ? rare : pool2);
    }
    out.push(rw);
  }
  return out;
}
function rewardText(rw) {
  switch (rw.id) {
    case 'coins': return { t: `コイン +${rw.n}枚`, d: 'すぐにもらえる' };
    case 'machine': return { t: `「${MACHINES[rw.type].name}」をもらう`, d: MACHINES[rw.type].desc };
    case 'kit': return { t: `改造キット${rw.n > 1 ? ' ×' + rw.n : ''}`, d: '「+」「×」の機械1台を <b>★改造</b>：効果 <b>+30%</b>（重ねがけできる）。準備画面で使う' };
    case 'slot': return { t: '設置枠 +1', d: '工事費なしで盤面の枠が1つ増える' };
    case 'patent': return { t: `特許 +${rw.n}`, d: 'ランの終わりに受け取る' };
    case 'quota': return { t: '納期のノルマ -20%', d: rw.big ? '次の期のノルマが軽くなる' : 'いまの期のノルマが軽くなる' };
    case 'shop': return { t: `明日のショップ +${rw.n}品`, d: 'リロールしても品数はそのまま' };
    case 'reroll': return { t: `リロール${rw.n}回無料`, d: '明日以降も使える' };
  }
  return { t: '?', d: '' };
}
function chooseReward(i) {
  const R = G.run;
  const rw = R.rewards && R.rewards[i];
  if (!rw) return false;
  switch (rw.id) {
    case 'coins': R.coins += rw.n; break;
    case 'machine': R.tray.push(makeMachine(rw.type)); break;
    case 'kit': R.kits += rw.n; break;
    case 'slot': R.boardCap++; break;
    case 'patent': R.stats.bonusPatents += rw.n; break;
    case 'quota': R.quotaCut = true; break;
    case 'shop': R.shopBonusNext += rw.n; break;
    case 'reroll': R.freeRerolls += rw.n; break;
  }
  R.rewards = null;
  return true;
}
// 改造キットを使う
function applyKit(uid) {
  const R = G.run;
  const f = findMachine(uid);
  if (!f || R.kits <= 0 || !canStar(f.m)) return false;
  R.kits--;
  f.m.star = (f.m.star || 0) + 1;
  G.dirty = true;
  return true;
}

function nextDay() {
  const R = G.run;
  const clearedToday = !!(R.lastReward && R.lastReward.clear);
  R.day++;
  // 納期を達成していたら、今日から次の期（納期は今日から PHASE_DAYS 日後）。ハイスコアモードでは期は進まない
  if (clearedToday && !R.hi) {
    R.phase++;
    startPhase();
  }
  R.lastReward = null;
  for (const m of placedMachines()) m.disabled = false;
  R.rerollCost = baseRerollCost();
  R.shopBonusToday = R.shopBonusNext;
  R.shopBonusNext = 0;
  R.rewards = null;
  prepareDay();
  rollShop();
  G.items = [];
  G.state = 'build';
  G.dirty = true;
}

// ---------- 自己ベストとランの履歴 ----------
// テストモード中のランは自己ベストに数えない（履歴には 🛠 付きで残す）
const HISTORY_MAX = 30;
function bumpBest(key, v) {
  const b = G.meta.best;
  if (devOn() || !(v > (b[key] || 0))) return false;
  b[key] = v;
  return true;
}
// 1日の終わり：途中でやめても記録が残るように、その日のうちに更新して保存する。clear は納期を達成したときの内容
// 戻り値：この日に初めて自己ベストを超えた項目（はじめてのランは「新記録」と言わない）
function recordDay(R, clear) {
  const out = [];
  const pb = R.prevBest || {};
  const check = (key, v) => {
    const was = G.meta.best[key] || 0;
    if (bumpBest(key, v) && (pb[key] || 0) > 0 && was <= (pb[key] || 0)) out.push(key);
  };
  check('item', R.dayStats.best);
  check('dayScore', R.dayScore);
  if (clear) {
    check('ratio', clear.ratio);
    check('lev', R.lev || 0);
    bumpBest('phase', clear.phase);
  }
  bumpBest('day', R.day);
  saveMeta();
  return out;
}
// ランの終わり：最後の自己ベストを更新して、履歴に1件足す
function recordRun(R, gained, reason) {
  bumpBest('day', R.stats.days);
  bumpBest('phase', R.stats.phasesCleared);
  bumpBest('item', R.stats.bestItem);
  bumpBest('lev', R.stats.levMax || 0);

  bumpBest('total', R.stats.totalShipped);
  bumpBest('patents', gained);
  if (R.hi && R.hi.done) bumpBest('hiscore', R.hi.total || 0);
  const pb = R.prevBest || {};
  const now = [['hiscore', R.hi && R.hi.done ? R.hi.total || 0 : 0], ['phase', R.stats.phasesCleared], ['item', R.stats.bestItem], ['dayScore', R.stats.bestDay], ['ratio', R.stats.bestRatio], ['lev', R.stats.levMax || 0], ['total', R.stats.totalShipped], ['patents', gained]];
  R.newRecords = devOn() ? [] : now.filter(([k, v]) => (pb[k] || 0) > 0 && v > pb[k]).map(([k]) => k);
  const board = placedMachines().map((m) => m.type);
  G.meta.history.unshift({
    t: Date.now(), days: R.stats.days, phases: R.stats.phasesCleared, win: !!R.victory, reason, layout: R.layout.name, hi: R.hi && R.hi.done ? R.hi.total || 0 : null,
    item: R.stats.bestItem, day: R.stats.bestDay, total: R.stats.totalShipped, lev: R.stats.levMax || 0,
    patents: gained, board, dev: devOn(),
  });
  G.meta.history.length = Math.min(G.meta.history.length, HISTORY_MAX);
}

// 特許 = 1日終えるごとに 0.5 ＋ 納期を達成するごとに 3×期 ×（レバレッジ倍率）＋ 完走で+5 ＋ 日報ボーナスの特許 ＋ ハイスコアの桁のボーナス
function patentsFor(R) {
  return Math.round(R.stats.patentPts) + (R.victory ? 5 : 0) + R.stats.bonusPatents;
}
// reason: 'fail' | 'retire' | 'quit'
function endRun(reason) {
  const R = G.run;
  if (!R || R.ended) return;
  R.ended = true;
  const gained = patentsFor(R);
  finishTutorial(); // 途中で終わっても、チュートリアルは済みにする（タイトルからもう一度見られる）
  G.meta.patents += gained;
  G.meta.runs++;
  if (R.victory) G.meta.wins = (G.meta.wins || 0) + 1;
  recordRun(R, gained, reason);
  saveMeta();
  G.state = 'over';
  G.dirty = true;
  UI.showGameOver(gained, reason);
}

// ---------- 見込み計算（画面には出さない。ボットと探索ツールが使う） ----------
function estimateDay() {
  const R = G.run;
  const sim = new Map();
  for (const m of placedMachines()) sim.set(m.uid, { ...m, counter: 0, dayCount: 0, fired: 0 });
  R.drySpent = 0; // 換金機が見込みの中で払うコイン
  const rnd = Math.random;
  Math.random = () => 0.99; // 宝くじ・呪いは手堅い見積もりで別計算（cautiousMean）。その他のランダムは固定
  let total = 0;
  let one = -1;
  // 本番と同じく時間を進めて、アイテムが混ざって流れる順番を再現する
  const speed = R.speed;
  const end = R.path.length - 1;
  const dt = 1 / 30;
  const items = [];
  let spawned = 0;
  let timer = 0;
  let shipped = 0;
  try {
    for (let guard = 0; guard < 20000 && (spawned < R.itemsToday || items.length); guard++) {
      timer -= dt;
      while (spawned < R.itemsToday && timer <= 0) {
        const it = { value: R.boss && R.boss.id === 'scrap' ? 0.1 : 1, tier: 0, alive: true, p: 0, last: 0, n: spawned++ };
        items.push(it);
        processTile(it, 0, sim, items);
        timer += SPAWN_INTERVAL;
      }
      for (const it of items) {
        if (!it.alive) continue;
        it.p += speed * dt;
        while (it.alive && it.last < end && Math.floor(it.p) > it.last) {
          it.last++;
          processTile(it, it.last, sim, items);
        }
        if (it.alive && it.last >= end) {
          const v = it.value * shipMulOf(it) * prodMul();
          if (one < 0) one = v; // 最初に出荷されたアイテム
          shipped++;
          if (!(R.boss && R.boss.id === 'inspect' && shipped % 4 === 0)) total += v;
          it.alive = false;
        }
      }
      for (let i = items.length - 1; i >= 0; i--) if (!items[i].alive) items.splice(i, 1);
    }
  } finally {
    Math.random = rnd;
  }
  G.estimate = { total: Math.min(total, 1e300), one: Math.max(0, one) };
}

// ---------- 演出 ----------
function addText(x, y, s, color, size = 14, bold = false) {
  G.texts.push({ x: x + (Math.random() - 0.5) * 8, y, s, color, size, bold, life: 0, max: 0.9, vy: -55 });
  if (G.texts.length > 260) G.texts.splice(0, G.texts.length - 260);
}
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 60 + Math.random() * 220;
    G.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, life: 0, max: 0.4 + Math.random() * 0.5, color, r: 1.5 + Math.random() * 2.5, g: 520 });
  }
  if (G.particles.length > 1200) G.particles.splice(0, G.particles.length - 1200);
}
// ノルマ達成の紙吹雪
function confetti() {
  const cols = ['#ffd447', '#ff7a59', '#6fe3a5', '#7fd6ff', '#f687b3', '#ffffff'];
  for (let i = 0; i < 140; i++) {
    G.particles.push({
      x: Math.random() * COLS * TILE, y: -10 - Math.random() * 120,
      vx: (Math.random() - 0.5) * 120, vy: 60 + Math.random() * 160,
      life: 0, max: 2 + Math.random() * 1.2, color: pick(cols), r: 3 + Math.random() * 3,
      g: 90, conf: true, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 14,
    });
  }
}
function addBeam(x1, y1, x2, y2, color, thick) {
  G.beams.push({ x1, y1, x2, y2, color, life: 0, max: thick ? 0.3 : 0.16, w: thick ? 5 : 2.5 });
  if (G.beams.length > 160) G.beams.splice(0, G.beams.length - 160);
}
// ギザギザの雷
function addBolt(x1, y1, x2, y2) {
  const pts = [[x1, y1]];
  const n = 7;
  const dx = x2 - x1;
  const dy = y2 - y1;
  const len = Math.hypot(dx, dy) || 1;
  for (let i = 1; i < n; i++) {
    const t = i / n;
    const off = (Math.random() - 0.5) * Math.min(40, len * 0.25);
    pts.push([x1 + dx * t + (-dy / len) * off, y1 + dy * t + (dx / len) * off]);
  }
  pts.push([x2, y2]);
  G.beams.push({ pts, color: '#fff27a', life: 0, max: 0.4, w: 3.5 });
}
function addRing(x, y, color, scale = 1) {
  G.rings.push({ x, y, color, life: 0, max: 0.3 + 0.12 * scale, r1: 30 * scale });
  if (G.rings.length > 140) G.rings.splice(0, G.rings.length - 140);
}
function flashScreen(a, color) {
  if (a > G.flash) {
    G.flash = a;
    G.flashColor = color;
  }
}

function updateEffects(dt) {
  for (const t of G.texts) {
    t.life += dt;
    t.y += t.vy * dt;
    t.vy *= Math.pow(0.04, dt);
  }
  G.texts = G.texts.filter((t) => t.life < t.max);
  for (const p of G.particles) {
    p.life += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.conf) {
      p.rot += p.vr * dt;
      p.vy += p.g * dt;
      p.vx *= Math.pow(0.5, dt);
    } else if (p.g) {
      p.vy += p.g * dt;
      p.vx *= Math.pow(0.2, dt);
    }
  }
  G.particles = G.particles.filter((p) => p.life < p.max);
  for (const b of G.beams) b.life += dt;
  G.beams = G.beams.filter((b) => b.life < b.max);
  for (const r of G.rings) r.life += dt;
  G.rings = G.rings.filter((r) => r.life < r.max);
  G.shake = Math.max(0, G.shake - dt * 40);
  G.shipPulse = Math.max(0, G.shipPulse - dt * 4);
  G.flash = Math.max(0, G.flash - dt * 2.2);
  G.zoom = Math.max(0, G.zoom - dt * 3.5);
  if (G.run) {
    for (const m of placedMachines()) m.flash = Math.max(0, m.flash - dt * 5);
    for (const it of G.items) it.pop = Math.max(0, it.pop - dt * 5);
    const target = G.run.phaseScore; // HUDは今の期の合計を出す
    G.dispScore += (target - G.dispScore) * Math.min(1, dt * 12);
    if (Math.abs(target - G.dispScore) < 0.5) G.dispScore = target;
  }
}

function update(realDt) {
  G.time += realDt;
  if (G.state === 'run') {
    let simDt = realDt * G.speedMul;
    if (G.hitstop > 0) {
      G.hitstop -= realDt;
      simDt *= 0.1;
    }
    while (simDt > 0 && G.state === 'run') {
      const step = Math.min(1 / 60, simDt);
      updateRun(step);
      simDt -= step;
    }
  } else {
    G.hitstop = 0;
  }
  updateEffects(realDt);
}

</script>
<script>
// ===== 描画 =====
// 重い shadowBlur は使わず、事前に作った「光のスプライト」を加算合成して光らせる
const Render = (() => {
  const W = COLS * TILE;
  const H = ROWS * TILE;
  const FONT = '"M PLUS 1p", "Yu Gothic UI", "Meiryo", sans-serif';
  let cv;
  let ctx;
  let titlePath = null;

  function init(canvas) {
    cv = canvas;
    ctx = cv.getContext('2d');
    titlePath = buildPath(LAYOUTS[0].pts);
    resize();
  }

  // 描画解像度（重い環境では自動で下げる）
  const QUALITY = [Math.min(2, window.devicePixelRatio || 1), 1.25, 1, 0.75];
  let quality = 0;
  let slowTime = 0;
  let lastDraw = 0;

  function resize() {
    const wrap = cv.parentElement;
    const r = wrap.getBoundingClientRect();
    // 盤面の下に右の欄が来る並び（style.css の縦並びのとき）か
    const narrow = getComputedStyle(wrap.parentElement).flexDirection === 'column';
    const availW = r.width - 20;
    const availH = narrow ? window.innerHeight * 0.72 : r.height - 20;
    const s = Math.max(0.2, Math.min(availW / W, availH / H));
    const cssW = Math.floor(W * s);
    const cssH = Math.floor(H * s);
    const k = (cssW * Math.min(QUALITY[0], QUALITY[quality])) / W;
    const bw = Math.round(W * k);
    const bh = Math.round(H * k);
    if (cv.style.width === cssW + 'px' && cv.width === bw && cv.height === bh) return;
    cv.style.width = cssW + 'px';
    cv.style.height = cssH + 'px';
    cv.width = bw;
    cv.height = bh;
    floorKey = '';
  }

  // 画面座標 → 盤面座標
  function toBoard(clientX, clientY) {
    const r = cv.getBoundingClientRect();
    const x = ((clientX - r.left) / r.width) * W;
    const y = ((clientY - r.top) / r.height) * H;
    return { x, y, cx: Math.floor(x / TILE), cy: Math.floor(y / TILE) };
  }

  // ---------- 色ヘルパー ----------
  const rgbCache = {};
  function hexRgb(h) {
    if (rgbCache[h]) return rgbCache[h];
    const n = parseInt(h.slice(1), 16);
    return (rgbCache[h] = [(n >> 16) & 255, (n >> 8) & 255, n & 255]);
  }
  function shade(h, amt) {
    const [r, g, b] = hexRgb(h);
    const f = (c) => Math.round(amt >= 0 ? c + (255 - c) * amt : c * (1 + amt));
    return `rgb(${f(r)},${f(g)},${f(b)})`;
  }
  function rgba(h, a) {
    const [r, g, b] = hexRgb(h);
    return `rgba(${r},${g},${b},${a})`;
  }
  function rr(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }
  const RAINBOW = ['#ff7a7a', '#ffb347', '#ffd447', '#6fe3a5', '#7fd6ff', '#a78bfa', '#f687b3'];
  function rainbow(offset = 0) {
    return RAINBOW[Math.floor(G.time * 10 + offset) % RAINBOW.length];
  }
  function unitColor(v) {
    const u = unitIndex(v);
    if (u >= 5) return rainbow(v % 7);
    return UNIT_COLORS[u];
  }

  // ---------- 光のスプライト（色ごとにキャッシュ） ----------
  const glowCache = new Map();
  function glow(color) {
    let c = glowCache.get(color);
    if (c) return c;
    c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, rgba(color, 0.9));
    grad.addColorStop(0.35, rgba(color, 0.35));
    grad.addColorStop(1, rgba(color, 0));
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
    glowCache.set(color, c);
    return c;
  }
  function drawGlow(color, x, y, radius, alpha = 1) {
    if (alpha <= 0.01) return;
    ctx.globalAlpha = alpha;
    ctx.drawImage(glow(color), x - radius, y - radius, radius * 2, radius * 2);
    ctx.globalAlpha = 1;
  }

  const fever = () => G.run && G.run.fever && (G.state === 'run' || G.state === 'result');

  // ---------- 床とベルトの土台（変化しないのでキャッシュ） ----------
  let floorCanvas = null;
  let floorKey = '';
  function buildFloor(R, fv) {
    const k = cv.width / W;
    if (!floorCanvas) floorCanvas = document.createElement('canvas');
    floorCanvas.width = cv.width;
    floorCanvas.height = cv.height;
    const c = floorCanvas.getContext('2d');
    c.setTransform(k, 0, 0, k, 0, 0);
    c.fillStyle = '#101218';
    c.fillRect(0, 0, W, H);
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (R && R.belt.has(idx(x, y))) continue;
        c.fillStyle = (x + y) % 2 ? '#181b24' : '#1a1e28';
        rr(c, x * TILE + 2, y * TILE + 2, TILE - 4, TILE - 4, 7);
        c.fill();
        // 準備中は「2本のベルトに挟まれた当たりマス」をうっすら示す
        if (R && G.state === 'build') {
          const h = beltHits(x, y);
          if (h >= 2) {
            c.fillStyle = h >= 3 ? 'rgba(255,212,71,0.08)' : 'rgba(127,214,255,0.06)';
            c.fill();
          }
        }
        if (fv) {
          c.fillStyle = 'rgba(255,190,60,0.05)';
          c.fill();
        }
      }
    }
    drawBeltBase(c, R ? R.path : titlePath, fv);
  }
  function drawFloor(R) {
    const fv = fever();
    const key = `${R ? R.layout.name + R.path.length : 'title'}|${G.state === 'build'}|${fv}|${cv.width}`;
    if (key !== floorKey) {
      buildFloor(R, fv);
      floorKey = key;
    }
    ctx.drawImage(floorCanvas, 0, 0, W, H);
  }

  // ---------- ベルト ----------
  function beltPoints(path) {
    const pts = path.map(([x, y]) => [(x + 0.5) * TILE, (y + 0.5) * TILE]);
    if (pts.length > 1) {
      const [a, b] = [pts[0], pts[1]];
      pts.unshift([a[0] - (b[0] - a[0]) * 0.5, a[1] - (b[1] - a[1]) * 0.5]);
      const n = pts.length;
      const [c, d] = [pts[n - 2], pts[n - 1]];
      pts.push([d[0] + (d[0] - c[0]) * 0.5, d[1] + (d[1] - c[1]) * 0.5]);
    }
    return pts;
  }
  function strokePath(pts, c = ctx) {
    c.beginPath();
    c.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
    c.stroke();
  }
  // ベルトの土台（キャッシュ側に描く）
  function drawBeltBase(c, path, fv) {
    const pts = beltPoints(path);
    c.save();
    c.lineJoin = 'round';
    c.lineCap = 'butt';
    if (fv) {
      c.strokeStyle = 'rgba(255,179,71,0.3)';
      c.lineWidth = 72;
      strokePath(pts, c);
    }
    c.strokeStyle = fv ? '#3a2a10' : '#07080c';
    c.lineWidth = 56;
    strokePath(pts, c);
    c.strokeStyle = '#2b3040';
    c.lineWidth = 46;
    strokePath(pts, c);
    c.strokeStyle = fv ? '#4a4030' : '#353b4e';
    c.lineWidth = 38;
    strokePath(pts, c);
    c.restore();
  }
  // 毎フレーム描くのは流れるストライプと出入口だけ
  function drawBelt(path, speedTiles) {
    const pts = beltPoints(path);
    const fv = fever();
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.lineCap = 'butt';
    // 流れるストライプ
    ctx.setLineDash([7, 17]);
    ctx.lineDashOffset = -(G.time * speedTiles * TILE) % 24;
    ctx.strokeStyle = fv ? 'rgba(255,200,80,0.28)' : 'rgba(0,0,0,0.28)';
    ctx.lineWidth = 34;
    strokePath(pts);
    ctx.setLineDash([]);
    ctx.restore();

    // 投入口・出荷口
    const s = path[0];
    const e = path[path.length - 1];
    drawGate((s[0] + 0.5) * TILE, (s[1] + 0.5) * TILE, '投入', '#5a6378', 0, false);
    drawGate((e[0] + 0.5) * TILE, (e[1] + 0.5) * TILE, '出荷', '#ffb347', G.shipPulse, fv);
  }
  function drawGate(x, y, label, color, pulse, fv) {
    const c = fv ? rainbow() : color;
    const glowA = Math.max(pulse, fv ? 0.5 : 0);
    if (glowA > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      drawGlow(fv ? c : '#ffd447', x, y, 60 + pulse * 30, glowA);
      ctx.restore();
    }
    ctx.save();
    ctx.translate(x, y);
    const sc = 1 + pulse * 0.14;
    ctx.scale(sc, sc);
    ctx.lineWidth = 3;
    ctx.strokeStyle = c;
    ctx.fillStyle = fv ? 'rgba(255,212,71,0.22)' : rgba(color, 0.12 + pulse * 0.3);
    rr(ctx, -28, -28, 56, 56, 10);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = c;
    ctx.font = `900 12px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, 0, -18);
    ctx.restore();
  }

  // ---------- 今日の特設マス ----------
  function drawSpecial(R) {
    if (!R.special || !R.special.size) return;
    const pulse = (Math.sin(G.time * 4) + 1) / 2;
    for (const [i, kind] of R.special) {
      const x = i % COLS;
      const y = Math.floor(i / COLS);
      const px = x * TILE;
      const py = y * TILE;
      if (kind === 'boost') {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        drawGlow('#ffd447', px + TILE / 2, py + TILE / 2, 40, 0.25 + pulse * 0.2);
        ctx.restore();
        ctx.strokeStyle = `rgba(255,212,71,${0.55 + pulse * 0.4})`;
        ctx.lineWidth = 2.5;
        rr(ctx, px + 3, py + 3, TILE - 6, TILE - 6, 9);
        ctx.stroke();
        ctx.font = `900 10px ${FONT}`;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillStyle = '#ffd447';
        ctx.fillText('★×2', px + 5, py + 4);
      } else {
        ctx.save();
        rr(ctx, px + 3, py + 3, TILE - 6, TILE - 6, 9);
        ctx.clip();
        ctx.strokeStyle = 'rgba(255,90,90,0.22)';
        ctx.lineWidth = 6;
        for (let k = -TILE; k < TILE * 2; k += 14) {
          ctx.beginPath();
          ctx.moveTo(px + k, py);
          ctx.lineTo(px + k - TILE, py + TILE);
          ctx.stroke();
        }
        ctx.restore();
        ctx.strokeStyle = 'rgba(255,107,107,0.8)';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 4]);
        rr(ctx, px + 3, py + 3, TILE - 6, TILE - 6, 9);
        ctx.stroke();
        ctx.setLineDash([]);
        if (!machineAt(x, y)) {
          ctx.font = `900 12px ${FONT}`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = '#ff8f8f';
          ctx.fillText('故障', px + TILE / 2, py + TILE / 2);
        }
      }
    }
  }

  // ---------- ハイライト ----------
  function markBeltAdj(x, y, color) {
    markBeltAdjCells([[x, y]], color);
  }
  // マスの並び（2マスの機械なら2マス）に接するベルトのマスを塗る
  function markBeltAdjCells(cells, color) {
    const seen = new Set();
    ctx.fillStyle = color;
    for (const [x, y] of cells) {
      for (const [dx, dy] of DIRS) {
        const bx = x + dx;
        const by = y + dy;
        if (!isBelt(bx, by) || seen.has(idx(bx, by))) continue;
        seen.add(idx(bx, by));
        rr(ctx, bx * TILE + 6, by * TILE + 6, TILE - 12, TILE - 12, 8);
        ctx.fill();
      }
    }
  }
  // 機械の使っているマスを1つの枠で囲む（2マスの機械は横長・縦長の枠）
  function outlineCells(cells, color, inset = 2, width = 2, dash) {
    if (!cells.length) return;
    let x0 = Infinity;
    let y0 = Infinity;
    let x1 = -Infinity;
    let y1 = -Infinity;
    for (const [x, y] of cells) {
      x0 = Math.min(x0, x);
      y0 = Math.min(y0, y);
      x1 = Math.max(x1, x);
      y1 = Math.max(y1, y);
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    if (dash) ctx.setLineDash(dash);
    rr(ctx, x0 * TILE + inset, y0 * TILE + inset, (x1 - x0 + 1) * TILE - inset * 2, (y1 - y0 + 1) * TILE - inset * 2, 9);
    ctx.stroke();
    if (dash) ctx.setLineDash([]);
  }
  // マスの並びの隣にいる機械に点線の枠（常時の機械が効く相手）
  function markMachineAdjCells(cells, color, self, sideOnly) {
    for (const o of adjOfCells(cells, self)) {
      if (sideOnly && isBeltType(o.type)) continue;
      outlineCells(cellsOf(o), color, 4, 2, [5, 4]);
    }
  }  // 反響レールが効く範囲（このマスと前後1マスの横の機械）
  function markEchoArea(x, y, color) {
    const k = pathIndex(x, y);
    const P = G.run.path;
    for (let j = Math.max(0, k - 1); j <= Math.min(P.length - 1, k + 1); j++) markMachineAdj(P[j][0], P[j][1], color, true);
  }
  function markMachineAdj(x, y, color, sideOnly) {
    markMachineAdjCells([[x, y]], color, machineAt(x, y), sideOnly);
  }
  // マスの下側に小さなラベルを出す
  function cellLabel(cx, cy, label, bg) {
    ctx.font = `900 11px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const tw = ctx.measureText(label).width + 10;
    const bx = (cx + 0.5) * TILE;
    const by = cy * TILE + TILE - 9;
    ctx.fillStyle = bg;
    rr(ctx, bx - tw / 2, by - 8, tw, 16, 8);
    ctx.fill();
    ctx.fillStyle = '#10121a';
    ctx.fillText(label, bx, by + 1);
  }
  function outlineCell(x, y, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    rr(ctx, x * TILE + 2, y * TILE + 2, TILE - 4, TILE - 4, 8);
    ctx.stroke();
  }
  // 手に持っている機械（選んでいる・ドラッグしている）。ショップからドラッグ中は、まだ買っていないので種類だけの仮の機械
  function heldMachine(R) {
    const selF = R.sel != null ? findMachine(R.sel) : null;
    if (selF) return { m: selF.m, where: selF.where };
    if (G.drag && G.drag.type) return { m: { type: G.drag.type, rot: G.drag.rot || 0, x: -1, y: -1, uid: -1 }, where: 'shop' };
    return null;
  }
  function centerOfCells(cells) {
    let sx = 0;
    let sy = 0;
    for (const [x, y] of cells) {
      sx += x;
      sy += y;
    }
    return { x: (sx / cells.length + 0.5) * TILE, y: (sy / cells.length + 0.5) * TILE };
  }
  function drawHighlights(R) {
    const h = G.hover;
    if (G.state === 'build') {
      const held = heldMachine(R);
      const real = held && held.where !== 'shop' ? held.m : null; // 盤面・手持ちにある本物の機械
      // ドラッグ中に R キーで向きを変えたときは、その向きで見せる（本物の向きは置くまで変えない）
      const hm = held && G.drag && G.drag.rot != null ? { ...held.m, rot: G.drag.rot } : held && held.m;
      const heldBelt = !!hm && isBeltType(hm.type);
      if (held && held.where === 'grid') outlineCells(cellsOf(hm), `rgba(255,212,71,${0.6 + Math.sin(G.time * 8) * 0.3})`, 1, 3);
      // チュートリアル：置いてほしいマス（2本のベルトに挟まれたマス）を金色に光らせる
      if (G.coachCells === 'pinch' && !heldBelt) {
        const a = 0.5 + Math.sin(G.time * 6) * 0.3;
        for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
          if (cellKind(x, y) === 'side' && beltHits(x, y) >= 2 && !machineAt(x, y)) outlineCell(x, y, `rgba(255,212,71,${a})`);
        }
      }
      // ベルト型を持っているときは、置けるベルトのマスをうっすら示す
      if (heldBelt) {
        const a = 0.18 + Math.sin(G.time * 5) * 0.08;
        ctx.strokeStyle = `rgba(255,179,71,${a})`;
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        for (let k = 1; k < R.path.length - 1; k++) {
          const [x, y] = R.path[k];
          if (machineAt(x, y)) continue;
          rr(ctx, x * TILE + 9, y * TILE + 9, TILE - 18, TILE - 18, 7);
          ctx.stroke();
        }
        ctx.setLineDash([]);
      }
      if (!h || !inBounds(h.cx, h.cy)) return;
      const kind = cellKind(h.cx, h.cy);
      const occ = machineAt(h.cx, h.cy);
      if (kind === 'side') {
        if (hm && !heldBelt) {
          // 持っている機械を、このマスに置いたときの見え方（大型は2マスぶん。置けない向きなら反対の向き）
          const big = cellCount(hm.type) > 1;
          let cells = [[h.cx, h.cy]];
          let ok = true;
          if (big) {
            const r = fitRot(hm, h.cx, h.cy, hm.rot || 0);
            ok = r != null;
            cells = footprint(hm.type, h.cx, h.cy, r == null ? hm.rot || 0 : r);
          } else ok = !occ || occ === real || cellCount(occ.type) < 2;
          const here = occ && occ === real && real.x === h.cx && real.y === h.cy && (real.rot || 0) === (hm.rot || 0);
          if (ok) markBeltAdjCells(cells, 'rgba(255,212,71,0.16)');
          if (ok && MACHINES[hm.type].kind === 'passive') markMachineAdjCells(cells, 'rgba(247,168,255,0.8)', real);
          if (!here && ok) {
            const c = centerOfCells(cells);
            ctx.globalAlpha = 0.55;
            drawMachineBody(hm.type, c.x, c.y, 1, 0, cells.length > 1 && cells[1][1] !== cells[0][1] ? 1 : 0);
            ctx.globalAlpha = 1;
          }
          outlineCells(cells, ok ? 'rgba(255,255,255,0.6)' : 'rgba(255,107,107,0.9)');
          const hits = cellsBeltHits(cells);
          cellLabel(h.cx, h.cy, !ok ? (big ? '2マス空いていない' : '大型とは入れ替えられない') : hits > 0 ? `${hits}回発動` : '発動なし', !ok ? '#ff8f8f' : hits >= 2 ? '#ffd447' : hits === 1 ? '#7fd6ff' : '#4a5163');
        } else if (heldBelt) {
          outlineCell(h.cx, h.cy, 'rgba(255,255,255,0.5)');
          if (!occ) cellLabel(h.cx, h.cy, 'ベルトの上へ', '#ff8f8f');
        } else {
          // 何も持っていない：このマス（機械があればその機械の全部のマス）が効くベルトと、隣の機械
          const cells = occ ? cellsOf(occ) : [[h.cx, h.cy]];
          markBeltAdjCells(cells, 'rgba(255,212,71,0.16)');
          if (occ && MACHINES[occ.type].kind === 'passive') markMachineAdjCells(cells, 'rgba(247,168,255,0.8)', occ);
          outlineCells(cells, 'rgba(255,255,255,0.5)');
          if (!occ) {
            const hits = cellsBeltHits(cells);
            cellLabel(h.cx, h.cy, hits > 0 ? `${hits}回発動` : '発動なし', hits >= 2 ? '#ffd447' : hits === 1 ? '#7fd6ff' : '#4a5163');
          }
        }
      } else if (kind === 'belt') {
        if (occ || heldBelt) {
          outlineCell(h.cx, h.cy, 'rgba(255,179,71,0.85)');
          if (occ && occ.type === 'echo') markEchoArea(h.cx, h.cy, 'rgba(247,168,255,0.8)');
          const elsewhere = hm && !(occ && occ === real);
          if (elsewhere && heldBelt) {
            if (hm.type === 'echo') markEchoArea(h.cx, h.cy, 'rgba(247,168,255,0.8)');
            ctx.globalAlpha = 0.6;
            drawBeltMachine(hm.type, h.cx, h.cy, 1, 0);
            ctx.globalAlpha = 1;
          }
          if (heldBelt || !occ) cellLabel(h.cx, h.cy, '1個1回', '#ffb347');
        }
      }
    } else if (h && inBounds(h.cx, h.cy)) {
      const m = machineAt(h.cx, h.cy);
      if (m && isBeltType(m.type)) {
        if (m.type === 'echo') markEchoArea(h.cx, h.cy, 'rgba(247,168,255,0.7)');
      } else if (m) {
        markBeltAdjCells(cellsOf(m), 'rgba(255,212,71,0.12)');
        if (MACHINES[m.type].kind === 'passive') markMachineAdjCells(cellsOf(m), 'rgba(247,168,255,0.7)', m);
      }
    }
  }
  // ---------- 機械 ----------
  // 機械の本体の大きさ（半分の幅・高さ）。2マスの機械は2マスにまたがる台座になる
  function bodyHalf(type, rot, scale = 1) {
    const big = cellCount(type) > 1;
    const w = big && !rot ? 25 + TILE / 2 : 25;
    const h = big && rot ? 25 + TILE / 2 : 25;
    return { w: w * scale, h: h * scale };
  }
  function drawMachineBody(type, cx, cy, scale, flash, rot) {
    const d = MACHINES[type];
    const big = cellCount(type) > 1;
    const hb = bodyHalf(type, rot, scale);
    if (flash > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      drawGlow(d.color, cx, cy, (big ? 72 : 52) + flash * 16, flash * 0.9);
      ctx.restore();
    }
    ctx.save();
    ctx.translate(cx, cy);
    // 機械の下の床（機械の色でうっすら縁取り）
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    rr(ctx, -hb.w + 1, -hb.h + 4, hb.w * 2, hb.h * 2, 10);
    ctx.fill();
    ctx.fillStyle = rgba(d.color, big ? 0.24 : 0.16);
    rr(ctx, -hb.w, -hb.h, hb.w * 2, hb.h * 2, 10);
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = d.kind === 'passive' ? 'rgba(247,168,255,0.7)' : rgba(d.color, 0.55);
    if (d.kind === 'passive') ctx.setLineDash([4, 3]);
    ctx.stroke();
    ctx.setLineDash([]);
    // 大型の台座には、2マスをつなぐ金具の線
    if (big) {
      ctx.strokeStyle = rgba(d.color, 0.35);
      ctx.lineWidth = 2;
      ctx.beginPath();
      if (rot) {
        ctx.moveTo(-hb.w + 6, 0);
        ctx.lineTo(hb.w - 6, 0);
      } else {
        ctx.moveTo(0, -hb.h + 6);
        ctx.lineTo(0, hb.h - 6);
      }
      ctx.stroke();
    }
    // ドット絵（16×16 を3倍、大型は4倍。ぼかさない）
    const s = (big ? 64 : 48) * scale;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(Sprites.canvas(type), -s / 2, -s / 2 - 1 * scale, s, s);
    ctx.imageSmoothingEnabled = true;
    if (flash > 0) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = flash * 0.45;
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(Sprites.canvas(type), -s / 2, -s / 2 - 1 * scale, s, s);
      ctx.imageSmoothingEnabled = true;
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
    // レアリティの印
    ctx.fillStyle = RARITY[d.rarity].color;
    ctx.beginPath();
    ctx.arc(hb.w - 7, -hb.h + 7, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  // ベルト型の機械：ベルトの上に置く「ゲート」。アイテムはこの上を通り抜ける
  function beltFlow(x, y) {
    const P = G.run.path;
    const k = pathIndex(x, y);
    const a = P[Math.max(0, k - 1)];
    const b = P[Math.min(P.length - 1, k + 1)];
    if (a[1] === b[1]) return 'h';
    if (a[0] === b[0]) return 'v';
    return 'c';
  }
  function drawBeltMachine(type, x, y, scale, flash) {
    const d = MACHINES[type];
    const cx = (x + 0.5) * TILE;
    const cy = (y + 0.5) * TILE;
    const flow = beltFlow(x, y);
    if (flash > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      drawGlow(d.color, cx, cy, 44 + flash * 18, flash * 0.9);
      ctx.restore();
    }
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    // ベルトの縁に立つ2本の柱（流れと直角）
    const post = (px, py, w, h) => {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      rr(ctx, px + 1, py + 3, w, h, 3);
      ctx.fill();
      ctx.fillStyle = shade(d.color, 0.1);
      rr(ctx, px, py, w, h, 3);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(px + 2, py + 1, w - 4, 2);
    };
    if (flow === 'h') {
      post(-17, -31, 34, 9);
      post(-17, 22, 34, 9);
    } else if (flow === 'v') {
      post(-31, -17, 9, 34);
      post(22, -17, 9, 34);
    } else {
      post(-31, -31, 11, 11);
      post(20, -31, 11, 11);
      post(-31, 20, 11, 11);
      post(20, 20, 11, 11);
    }
    // 床に光るプレート
    ctx.fillStyle = rgba(d.color, 0.32 + flash * 0.35);
    rr(ctx, -20, -20, 40, 40, 8);
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = shade(d.color, 0.35);
    ctx.stroke();
    // ドット絵（16×16 を2倍）
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(Sprites.canvas(type), -16, -16, 32, 32);
    ctx.imageSmoothingEnabled = true;
    ctx.restore();
  }

  function drawMachines(R) {
    for (const m of placedMachines()) {
      const c = machineCenter(m);
      const cx = c.x;
      const cy = c.y;
      const hb = bodyHalf(m.type, m.rot || 0);
      const lifted = G.state === 'build' && (R.sel === m.uid || (G.drag && G.drag.uid === m.uid));
      // ドラッグ中の機械は、元の場所に薄く残す
      if (G.drag && G.drag.uid === m.uid && G.drag.moved) ctx.globalAlpha = 0.35;
      // 稼働中は機械がわずかに呼吸する
      const breathe = G.state === 'run' && !m.disabled ? Math.sin(G.time * 4 + m.uid) * 0.015 : 0;
      if (isBeltType(m.type)) {
        drawBeltMachine(m.type, m.x, m.y, 1 + m.flash * 0.12 + (lifted ? 0.08 + Math.sin(G.time * 8) * 0.03 : 0), m.flash);
      } else {
        drawMachineBody(m.type, cx, cy - (lifted ? 3 : 0), 1 + m.flash * (cellCount(m.type) > 1 ? 0.1 : 0.2) + breathe + (lifted ? 0.06 : 0), m.flash, m.rot || 0);
      }
      ctx.globalAlpha = 1;
      // 「N回ごとに発動」系の機械はたまり具合をゲージで見せる
      const d = MACHINES[m.type];
      const broken = machineSpecial(m) === 'broken';
      // 改造★
      if (m.star) {
        const label = m.star > 1 ? '★' + m.star : '★';
        ctx.font = `900 11px ${FONT}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const tw = ctx.measureText(label).width + 8;
        ctx.fillStyle = 'rgba(20,16,4,0.85)';
        rr(ctx, cx - hb.w - 2, cy - hb.h - 5, tw, 14, 7);
        ctx.fill();
        ctx.fillStyle = '#ffd447';
        ctx.fillText(label, cx - hb.w - 2 + tw / 2, cy - hb.h + 2);
      }
      // 状態で倍率が変わる機械（金庫・共鳴器・熟練工）は今の倍率を表示
      const lm = !m.disabled && !broken ? liveMult(m) : null;
      if (lm) {
        const label = '×' + (lm >= 100 ? fmt(lm) : fmtMult(Math.round(lm * 10) / 10));
        ctx.font = `900 11px ${FONT}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const tw = ctx.measureText(label).width + 8;
        ctx.fillStyle = 'rgba(8,9,13,0.8)';
        rr(ctx, cx - tw / 2, cy + 15, tw, 14, 7);
        ctx.fill();
        ctx.fillStyle = '#ffd9a0';
        ctx.fillText(label, cx, cy + 22);
      }
      const charge = chargeOf(m);
      if (charge && G.state === 'run' && !m.disabled && !broken) {
        const k = (m.counter % charge) / charge;
        const ready = m.counter % charge === charge - 1;
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        rr(ctx, cx - 20, cy + 18, 40, 6, 3);
        ctx.fill();
        ctx.fillStyle = ready && Math.sin(G.time * 20) > 0 ? '#ffffff' : shade(d.color, 0.35);
        rr(ctx, cx - 20, cy + 18, Math.max(6, 40 * (ready ? 1 : k)), 6, 3);
        ctx.fill();
      }
      const unpaid = m.disabled || (G.state === 'build' && upkeepShort(m)); // 維持費が払えない
      if (unpaid || broken) {
        ctx.fillStyle = 'rgba(5,6,10,0.7)';
        rr(ctx, cx - hb.w - 1, cy - hb.h - 1, hb.w * 2 + 2, hb.h * 2 + 2, 11);
        ctx.fill();
        ctx.fillStyle = '#ff6b6b';
        ctx.font = `900 20px ${FONT}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(broken ? '故障' : '未払', cx, cy);
      }
    }
  }

  // ---------- ビーム・波紋 ----------
  function beamPath(b) {
    ctx.beginPath();
    if (b.pts) {
      ctx.moveTo(b.pts[0][0], b.pts[0][1]);
      for (let i = 1; i < b.pts.length; i++) ctx.lineTo(b.pts[i][0], b.pts[i][1]);
    } else {
      ctx.moveTo(b.x1, b.y1);
      ctx.lineTo(b.x2, b.y2);
    }
  }
  function drawBeams() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (const b of G.beams) {
      const k = b.life / b.max;
      const a = Math.max(0, 1 - k);
      beamPath(b);
      // 外側のにじみ → 芯
      ctx.globalAlpha = a * 0.3;
      ctx.strokeStyle = b.color;
      ctx.lineWidth = b.w * 3.5;
      ctx.stroke();
      ctx.globalAlpha = a;
      ctx.lineWidth = b.w * (1 - k * 0.6);
      ctx.stroke();
      if (b.pts) {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }
    }
    ctx.restore();
  }
  function drawRings() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const r of G.rings) {
      const k = r.life / r.max;
      const e = 1 - Math.pow(1 - k, 3);
      ctx.globalAlpha = Math.max(0, 1 - k) * 0.9;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = 3 * (1 - k) + 0.5;
      ctx.beginPath();
      ctx.arc(r.x, r.y, 6 + r.r1 * e, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---------- アイテム ----------
  function drawItems() {
    // 軌跡と光（加算合成）
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const it of G.items) {
      if (!it.alive) continue;
      const p = itemPos(it);
      if (!it.trail) it.trail = [];
      it.trail.push(p.x, p.y);
      if (it.trail.length > 20) it.trail.splice(0, 2);
      // 熱をためたアイテムは赤く光る（急冷槽で一気に掛け算）
      if (it.heat > 0) drawGlow('#ff5a2a', p.x, p.y, 16 + Math.min(20, it.heat * 3), Math.min(0.75, 0.2 + it.heat * 0.08));
      const u = unitIndex(it.value);
      if (u < 1 && it.tier < 3) continue;
      const col = it.tier === 3 && u < 2 ? '#ffd447' : unitColor(it.value);
      const n = it.trail.length;
      for (let i = 0; i < n - 2; i += 4) {
        const a = i / n;
        drawGlow(col, it.trail[i], it.trail[i + 1], 6 + a * (8 + u * 2), a * 0.5);
      }
      const mag = Math.log10(it.value + 1);
      drawGlow(col, p.x, p.y, 20 + Math.min(30, mag * 2.5), 0.55 + it.pop * 0.3);
    }
    ctx.restore();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const it of G.items) {
      if (!it.alive) continue;
      const p = itemPos(it);
      const x = p.x + (it.seed - 0.5) * 8;
      const y = p.y + ((it.seed * 7) % 1 - 0.5) * 8;
      const t = TIERS[it.tier];
      const mag = Math.log10(it.value + 1);
      const r = (8 + Math.min(12, mag * 2.2)) * (1 + it.pop * 0.3);
      ctx.fillStyle = t.color;
      ctx.beginPath();
      if (it.tier === 0) {
        // 石はゴツゴツした多角形
        for (let i = 0; i < 7; i++) {
          const a = (i / 7) * Math.PI * 2 + it.seed * 6;
          const rr2 = r * (0.85 + ((it.seed * (i + 3) * 13) % 1) * 0.25);
          if (i === 0) ctx.moveTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2);
          else ctx.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2);
        }
        ctx.closePath();
      } else {
        ctx.arc(x, y, r, 0, Math.PI * 2);
      }
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = t.edge;
      ctx.stroke();
      // 触媒をまとったアイテム（次の「×」がもう1回かかる）
      if (it.cata > 0) {
        ctx.save();
        ctx.strokeStyle = 'rgba(166,240,106,0.9)';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 3]);
        ctx.lineDashOffset = -G.time * 30;
        ctx.beginPath();
        ctx.arc(x, y, r + 5, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.beginPath();
      ctx.arc(x - r * 0.35, y - r * 0.35, r * 0.28, 0, Math.PI * 2);
      ctx.fill();
      // 金はキラッと光る
      if (it.tier === 3) {
        const tw = (Math.sin(G.time * 9 + it.seed * 20) + 1) / 2;
        if (tw > 0.75) {
          ctx.strokeStyle = `rgba(255,255,255,${(tw - 0.75) * 4})`;
          ctx.lineWidth = 1.5;
          const sx = x + r * 0.4;
          const sy = y - r * 0.5;
          ctx.beginPath();
          ctx.moveTo(sx - 5, sy);
          ctx.lineTo(sx + 5, sy);
          ctx.moveTo(sx, sy - 5);
          ctx.lineTo(sx, sy + 5);
          ctx.stroke();
        }
      }
      // 価値ラベル（単位で色が変わる）
      const fs = 11 + Math.min(6, mag * 0.9);
      ctx.font = `900 ${fs}px ${FONT}`;
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(8,9,13,0.9)';
      const s = fmt(it.value);
      ctx.strokeText(s, x, y - r - 8);
      ctx.fillStyle = unitColor(it.value);
      ctx.fillText(s, x, y - r - 8);
      // ためた熱・浴びた雷の回数
      if (it.heat > 0 || it.zap > 0) {
        ctx.font = `900 9px ${FONT}`;
        ctx.lineWidth = 2.5;
        const parts = [];
        if (it.heat > 0) parts.push(['熱' + it.heat, '#ff9a5c']);
        if (it.zap > 0) parts.push(['雷' + it.zap, '#fff27a']);
        const ws = parts.map(([t]) => ctx.measureText(t).width);
        let bx = x - (ws.reduce((a, b) => a + b, 0) + (parts.length - 1) * 3) / 2;
        ctx.textAlign = 'left';
        parts.forEach(([t, col], i) => {
          ctx.strokeText(t, bx, y + r + 7);
          ctx.fillStyle = col;
          ctx.fillText(t, bx, y + r + 7);
          bx += ws[i] + 3;
        });
        ctx.textAlign = 'center';
      }
    }
  }

  function drawParticles() {
    for (const p of G.particles) {
      ctx.globalAlpha = Math.max(0, 1 - p.life / p.max);
      ctx.fillStyle = p.color;
      if (p.conf) {
        // 紙吹雪は回転を幅の伸び縮みで表現（save/restoreを避けて軽く）
        const w = Math.abs(Math.cos(p.rot)) * p.r * 2 + 1;
        ctx.fillRect(p.x - w / 2, p.y - p.r * 0.5, w, p.r);
      } else {
        ctx.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
      }
    }
    ctx.globalAlpha = 1;
  }
  function drawTexts() {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const t of G.texts) {
      const k = t.life / t.max;
      const a = Math.max(0, 1 - k * k);
      const pop = t.life < 0.12 ? 1.4 - (t.life / 0.12) * 0.4 : 1;
      if (t.bold && t.size >= 17) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        drawGlow(t.color, t.x, t.y, t.size * 2.2, a * 0.45);
        ctx.restore();
      }
      ctx.globalAlpha = a;
      ctx.font = `${t.bold ? 900 : 700} ${Math.round(t.size * pop)}px ${FONT}`;
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(8,9,13,0.85)';
      ctx.strokeText(t.s, t.x, t.y);
      ctx.fillStyle = t.color;
      ctx.fillText(t.s, t.x, t.y);
    }
    ctx.globalAlpha = 1;
  }

  // 画面全体のフラッシュとフィーバーの縁取り
  let vignette = null;
  function drawOverlays() {
    if (fever()) {
      if (!vignette) {
        // 低解像度で一度だけ作って引き伸ばす
        vignette = document.createElement('canvas');
        vignette.width = W / 4;
        vignette.height = H / 4;
        const c = vignette.getContext('2d');
        const g = c.createRadialGradient(W / 8, H / 8, H * 0.09, W / 8, H / 8, W * 0.175);
        g.addColorStop(0, 'rgba(255,180,60,0)');
        g.addColorStop(1, 'rgba(255,170,40,1)');
        c.fillStyle = g;
        c.fillRect(0, 0, W / 4, H / 4);
      }
      ctx.globalAlpha = 0.18 + Math.sin(G.time * 6) * 0.08;
      ctx.drawImage(vignette, 0, 0, W, H);
      ctx.globalAlpha = 1;
    }
    if (G.flash > 0) {
      ctx.globalAlpha = G.flash * 0.55;
      ctx.fillStyle = G.flashColor;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  // フレームが重い状態が続いたら解像度を1段下げる
  function adaptQuality() {
    const now = performance.now();
    const dt = lastDraw ? now - lastDraw : 16;
    lastDraw = now;
    if (dt > 250) return; // タブ切り替え直後などは無視
    slowTime = dt > 28 ? slowTime + dt : Math.max(0, slowTime - dt * 0.5);
    if (slowTime > 1500 && quality < QUALITY.length - 1) {
      quality++;
      slowTime = 0;
      resize();
    }
  }

  function draw() {
    adaptQuality();
    const k = cv.width / W;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    const R = G.run;
    ctx.save();
    if (G.shake > 0) ctx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);
    if (G.zoom > 0) {
      const z = 1 + G.zoom * 0.035;
      ctx.translate(W / 2, H / 2);
      ctx.scale(z, z);
      ctx.translate(-W / 2, -H / 2);
    }
    drawFloor(R);
    if (R) {
      drawBelt(R.path, G.state === 'run' ? R.curSpeed * G.speedMul : 0.25);
      drawSpecial(R);
      drawHighlights(R);
      drawBeams();
      drawMachines(R);
      drawRings();
      drawItems();
    } else {
      drawBelt(titlePath, 0.6);
    }
    drawParticles();
    drawTexts();
    ctx.restore();
    drawOverlays();
  }

  return { init, resize, draw, toBoard, W, H };
})();

</script>
<script>
// ===== UI（HUD・サイドパネル・オーバーレイ・入力・メインループ） =====
const UI = (() => {
  const $ = (id) => document.getElementById(id);
  const KIND_LABEL = { add: '加算', mult: '乗算', transform: '変換', special: '特殊', passive: '常時' };
  let side, overlay, card, bannerEl, canvas;
  const hudCache = {};
  let infoKey = '';

  // ---------- 共通 ----------
  function setText(id, v) {
    if (hudCache[id] === v) return;
    hudCache[id] = v;
    const el = $(id);
    if (el) el.textContent = v;
  }
  // style: true / 'bad' = 赤、'unit' = 虹色の大きな文字
  function banner(text, style) {
    bannerEl.textContent = text;
    bannerEl.className = '';
    void bannerEl.offsetWidth;
    const cls = style === true || style === 'bad' ? ' bad' : style === 'unit' ? ' unit' : '';
    bannerEl.className = 'show' + cls;
  }
  // 数字がカウントアップしていく演出
  function countUp(el, target, dur) {
    const t0 = performance.now();
    function step(t) {
      const k = Math.min(1, (t - t0) / (dur * 1000));
      const e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmt(target * e);
      if (k < 1) {
        Sfx.tick();
        requestAnimationFrame(step);
      } else {
        el.classList.add('done');
      }
    }
    requestAnimationFrame(step);
  }
  function showOverlay(html, wide) {
    card.classList.toggle('wide', wide === 'wide');
    card.innerHTML = html;
    overlay.classList.remove('hidden');
  }
  function hideOverlay() {
    overlay.classList.add('hidden');
  }
  function glyphHTML(type, extra = '', attrs = '', star = 0) {
    const d = MACHINES[type];
    const cls = d.belt ? ' beltg' : '';
    const st = star ? `<span class="star">★${star > 1 ? star : ''}</span>` : '';
    return `<div class="glyph${cls} ${extra}" style="background:radial-gradient(circle at 50% 40%, ${d.color}66, #12141b 78%);border-color:${d.color}88" ${attrs}><img class="spr" src="${Sprites.url(type)}" alt="${d.glyph}" draggable="false">${st}</div>`;
  }
  const BELT_TAG = '<span class="belt-tag">ベルト型</span>';

  // ---------- HUD ----------
  function updateHUD() {
    const R = G.run;
    if (!R) {
      setText('hud-day', '-');
      setText('hud-dayof', '');
      setText('hud-score', '0');
      setText('hud-quota', '0');
      setText('hud-coins', '-');
      setText('hud-machines', '-');
      setText('hud-items', '-');
      setText('hud-phase', '-');
      $('hud-bar').style.width = '0%';
      $('hud-bar-over').style.width = '0%';
      return;
    }
    setText('hud-day', String(R.day));
    setText('hud-dayof', R.hi ? ` / 最終日 ${R.hi.endDay}` : ` / 納期 ${R.deadline}`);
    setText('hud-qlabel', R.hi ? 'ハイスコア / 自己ベスト' : `第${R.phase}期の出荷 / ノルマ`);
    setText('hud-score', fmt(G.dispScore));
    setText('hud-quota', isFinite(R.quota) ? fmt(R.quota) : '—');
    setText('hud-coins', String(R.coins));
    setText('hud-machines', `${slotsUsed()}/${dayCap()}`);
    setText('hud-items', G.state === 'run' ? `${R.itemsToday - R.spawned}` : `${R.itemsToday}`);
    const on = R.boss ? `ボス：${R.boss.name}` : R.hi ? `ハイスコア あと${Math.max(0, R.hi.endDay - R.day + (G.state === 'result' ? 0 : 1))}日` : `第${R.phase}期 / ${PHASES}`;
    if (hudCache['hud-phase'] !== on) $('hud-phase').classList.toggle('boss', !!R.boss);
    setText('hud-phase', on);
    const ratio = G.dispScore / R.quota;
    $('hud-bar').style.width = Math.min(100, ratio * 100) + '%';
    $('hud-bar-over').style.width = ratio > 1 ? Math.min(100, (Math.log2(ratio) / 5) * 100) + '%' : '0%';
    $('hud-bar').parentElement.classList.toggle('done', ratio >= 1);
    const fv = !!(R.fever && (G.state === 'run' || G.state === 'result'));
    if (hudCache.fever !== fv) {
      hudCache.fever = fv;
      $('hud').classList.toggle('fever', fv);
    }
    // 出荷額の単位が上がったらHUDの数字を弾ませる
    const su = unitIndex(G.dispScore);
    if (hudCache.scoreUnit !== su) {
      const el = $('hud-score');
      if (su > (hudCache.scoreUnit || 0)) {
        el.classList.remove('bump');
        void el.offsetWidth;
        el.classList.add('bump');
      }
      hudCache.scoreUnit = su;
      el.style.color = su >= 5 ? '#f687b3' : su > 0 ? UNIT_COLORS[su] : '';
    }
    updateCoach();
    if (G.state === 'run') {
      setText('rs-today', fmt(R.dayScore));
      setText('rs-combo', `${R.combo} (最大 ${R.dayStats.maxCombo})`);
      setText('rs-spawn', `${R.spawned} / ${R.itemsToday}`);
      setText('rs-best', fmt(R.dayStats.best));
      setText('rs-dup', String(R.dayStats.dup));
      setText('rs-split', String(R.dayStats.split));
      setText('rs-destroy', String(R.dayStats.destroyed));
      setText('rs-coins', (R.dayStats.coins >= 0 ? '+' : '') + R.dayStats.coins);
    }
  }

  // ---------- サイドパネル ----------
  function renderSide() {
    infoKey = '';
    const R = G.run;
    if (!R || G.state === 'title') {
      side.innerHTML = `<div class="tip">タイトル画面</div>`;
      return;
    }
    if (G.state === 'build') return renderBuild(R);
    return renderRun(R);
  }

  function bossHTML(R) {
    return R.boss
      ? `<div class="boss"><div class="t">⚠ ボス日：${R.boss.name}</div><div class="d">${R.boss.desc}</div></div>`
      : '';
  }
  // ---------- チュートリアル（はじめてのランだけ。盤面の上に「次にやること」を1つずつ出す） ----------
  // いまの状態から「次にやること」を決める（順番を覚えておく必要がないので、どんな操作をしても食い違わない）
  //   key: 表示の切り替え用 / n: 何番目か / target: 光らせる右の欄の部品 / cells: 光らせる盤面のマス / ok: 「OK」で閉じる説明
  function coachStep() {
    const R = G.run;
    if (!R || !R.tut || !overlay.classList.contains('hidden')) return null;
    if (G.state === 'run') {
      return R.day === 1
        ? { key: 'run', html: '原料が <b>投入口</b> から流れてきます。機械の横を通るたびに価値が増え、<b>出荷口</b> に着くと出荷額になります。' }
        : null;
    }
    if (G.state !== 'build') return null;
    if (R.day === 1) {
      const bought = R.shop.some((s) => s.sold);
      const afford = R.shop.some((s) => !s.sold && R.coins >= MACHINES[s.type].cost) && ownedCount() < ownedCap();
      if (R.sel != null) {
        return { key: 'place', n: 2, cells: 'pinch', html: '盤面の <b>ベルトの横のマス</b> をクリックして置きます。<b style="color:#ffd447">金色に光るマス</b> は2本のベルトに挟まれていて、アイテム1個に <b>2回</b> 効きます。' };
      }
      if (R.tray.length) {
        return { key: placedCount() ? 'pick2' : 'pick', n: 1, target: '.tray', html: placedCount() ? '残りの機械も置きましょう。右の <b>手持ち</b> の機械をクリックして選びます。' : 'まず機械を置きます。右の <b>手持ち</b> にある機械をクリックして選びます。' };
      }
      if (!bought && afford) {
        return { key: 'buy', n: 3, target: '.cards', html: '<b>ショップ</b> で機械を1台買ってみましょう。「+」は足し算、「×」は掛け算。足してから掛けると大きくなります。' };
      }
      return { key: 'start', n: 4, target: '#btn-start', html: `準備ができました。<b>稼働開始</b> を押します。<br>ノルマは <b>期ごとの合計</b> です。第1期は、納期（${PHASE_DAYS}日目）までの合計で届けば大丈夫。` };
    }
    const seen = R.tut.seen;
    if (R.day === 2 && !seen.d2) {
      return { key: 'd2', ok: 'd2', html: '今日から <b style="color:#ffd447">★強化マス</b>（置いた機械が2回発動）と <b style="color:#ff6b6b">✕故障マス</b>（置いた機械が止まる）が出ます。場所は毎日変わります。<br>盤面の機械は、クリックして選んでから別のマスをクリックすると動かせます。' };
    }
    if (R.day >= 3 && !seen.d3) {
      return { key: 'd3', ok: 'd3', html: '今日からショップに <b>いろいろな機械</b> が並びます。説明文の「何に反応するか」を読んで、組み合わせを探してみましょう。<br>枠がいっぱいなら <b>設置枠を増やす</b> か、弱い機械を売って入れ替えます。チュートリアルはここまでです。' };
    }
    return null;
  }
  let coachKey = '';
  function updateCoach() {
    const el = $('coach');
    if (!el) return;
    const st = coachStep();
    G.coachCells = st && st.cells ? st.cells : null;
    // 光らせる相手（右の欄は描き直されるので、毎回つけ直す）
    for (const q of ['.tray', '.cards', '#btn-start']) {
      const t = side.querySelector(q);
      if (t) t.classList.toggle('coach-target', !!st && st.target === q);
    }
    const key = st ? st.key : '';
    if (key === coachKey) return;
    coachKey = key;
    // 光らせた部品が画面の外（右の欄の下のほう）にあれば、見えるところまで送る
    const tgt = st && st.target ? side.querySelector(st.target) : null;
    if (tgt && tgt.scrollIntoView) tgt.scrollIntoView({ block: 'center', behavior: 'smooth' });
    if (!st) {
      el.classList.add('hidden');
      return;
    }
    el.innerHTML = `<div class="coach-h">チュートリアル${st.n ? `<span>${st.n} / 4</span>` : ''}</div><div class="coach-t">${st.html}</div>
      <div class="coach-b">${st.ok ? `<button class="btn small" data-coach="${st.ok}">OK</button>` : ''}<button class="coach-skip" data-coach="skip">チュートリアルを終わる</button></div>`;
    el.classList.remove('hidden');
  }
  function onCoachClick(e) {
    const b = e.target.closest('[data-coach]');
    if (!b || !G.run || !G.run.tut) return;
    Sfx.click();
    const k = b.dataset.coach;
    if (k === 'skip' || k === 'd3') finishTutorial();
    else G.run.tut.seen[k] = true;
    coachKey = '?'; // 次のフレームで出し直す
  }
  // はじめて「出勤する」を押したときの説明
  function showTutorialIntro() {
    showOverlay(`
      <h2>はじめての出勤：チュートリアル</h2>
      <p>ベルトを流れる原料の価値を、機械で <b style="color:var(--accent)">足して、掛けて</b>、ノルマ以上を出荷するゲームです。</p>
      <div class="tut-pts">
        <div><b>1</b><span>ベルトの横に機械を置く</span></div>
        <div><b>2</b><span>稼働開始。原料が流れて、機械が価値を増やす</span></div>
        <div><b>3</b><span>納期（${PHASE_DAYS}日ごと）までの合計で、ノルマを超える</span></div>
      </div>
      <p class="lead" style="font-size:13px">最初の1日は、盤面の上に「次にやること」が1つずつ出ます（1分ほど）。</p>
      <div class="menu-btns">
        <button class="btn" data-act="tut-start">はじめる</button>
        <button class="btn sub" data-act="tut-skip">チュートリアルなしで遊ぶ</button>
      </div>`);
  }
  // 今日の特設マス
  function specialHTML(R) {
    if (!R.special || !R.special.size) return '';
    let boost = 0;
    let broken = 0;
    for (const v of R.special.values()) v === 'boost' ? boost++ : broken++;
    return `<div class="special-line">
      ${boost ? `<span class="sp-boost">★強化マス ×${boost}</span>：置いた機械が <b>2回</b> 発動` : ''}
      ${broken ? `<br><span class="sp-broken">✕故障マス ×${broken}</span>：置いた機械は今日動かない` : ''}</div>`;
  }

  // レバレッジ：期の最初の日の準備中に決める。上げるほどその期のノルマが重く、納期達成の報酬と特許が増える
  function leverageHTML(R) {
    const lv = R.lev || 0;
    const coin = Math.round((levCoinMul(lv) - 1) * 100);
    const pat = Math.round((levPatentMul(lv) - 1) * 100);
    const locked = !R.phaseFresh; // この期はもう動き出している
    return `<div class="lev ${lv > 0 ? 'on' : ''} ${locked ? 'locked' : ''}" title="レバレッジ：上げるほどこの期のノルマが重くなり、納期達成の報酬と特許が増える（期の最初の日に決める）">
        <button class="btn sub small" id="btn-lev-down" ${locked || lv <= 0 ? 'disabled' : ''}>◀</button>
        <div class="lev-v"><b>レバレッジ Lv ${lv}</b>
          <span>ノルマ <b>×${fmt(Math.pow(LEV_QMUL, lv))}</b> ・ 納期達成の報酬 <b>+${coin}%</b> ・ 特許 <b>+${pat}%</b></span>
          ${locked ? '<span>この期は変えられません（期の最初の日に決めます）</span>' : ''}</div>
        <button class="btn sub small" id="btn-lev-up" ${locked || lv >= LEV_MAX ? 'disabled' : ''}>▶</button>
      </div>`;
  }
  // 今の期のノルマと、納期までの残り
  function phaseDockHTML(R) {
    const left = R.deadline - R.day + 1; // 今日を入れた残り日数
    if (R.hi) {
      return `<div class="dock-est"><span>ハイスコアモード</span><b>${fmt(R.phaseScore)}</b></div>
        <div class="dock-sub"><span>自己ベスト ${R.hi.best > 0 ? fmt(R.hi.best) : '—'}</span>
          <span class="${left <= 1 ? 'last' : ''}">${left <= 1 ? '今日が最終日' : `あと${left}日`}</span></div>`;
    }
    const need = Math.max(0, R.quota - R.phaseScore);
    return `<div class="dock-est"><span>第${R.phase}期のノルマ</span><b>${fmt(R.quota)}</b></div>
      <div class="dock-sub"><span>${R.phaseScore > 0 ? `これまで ${fmt(R.phaseScore)} ・ あと <b>${fmt(need)}</b>` : '納期までの合計で数えます'}</span>
        <span class="${left <= 1 ? 'last' : ''}">${left <= 1 ? '今日が納期' : `納期まで あと${left}日`}</span></div>`;
  }

  // ショップ欄を閉じているか（見た目だけの設定。この端末にだけ覚える）
  const UI_KEY = 'conveyor-alchemy-ui-v1';
  let shopClosed = false;
  try { shopClosed = !!(JSON.parse(localStorage.getItem(UI_KEY) || '{}').shopClosed); } catch (err) { /* 既定は開く */ }
  function renderBuild(R) {
    const owned = ownedCount();
    const oCap = ownedCap();
    const placed = slotsUsed(); // 大型は2枠ぶん
    const sCost = runSlotCost();
    const cards = R.shop
      .map((s, i) => {
