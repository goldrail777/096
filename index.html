        const d = MACHINES[s.type];
        const cant = !s.sold && (R.coins < d.cost || owned >= oCap);
        return `<button class="card ${s.sold ? 'sold' : ''} ${cant ? 'cant' : ''}" data-shop="${i}">
          ${glyphHTML(s.type)}
          <div><div class="name">${d.name}<span class="rar" style="color:${RARITY[d.rarity].color}">${RARITY[d.rarity].name}</span>${d.belt ? BELT_TAG : ''}${cellCount(s.type) > 1 ? '<span class="big-tag">2マス</span>' : ''}</div>
          <div class="desc">${d.desc}</div></div>
          <div class="price">${s.sold ? '売切' : d.cost + '枚'}</div>
        </button>`;
      })
      .join('');
    const tray = R.tray.length
      ? R.tray.map((m) => glyphHTML(m.type, R.sel === m.uid ? 'sel' : '', `data-tray="${m.uid}" title="${MACHINES[m.type].name}"`, m.star)).join('')
      : `<span class="empty">なし（盤面の機械をクリックで選択・移動）</span>`;
    const rerollLabel = R.freeRerolls > 0 ? `リロール 無料（残り${R.freeRerolls}）` : `リロール ${R.rerollCost}枚`;
    side.innerHTML = `
      <div class="section">
        <div class="layout-name">${R.layout.name}（ノルマ×${R.layout.qmul}） ・ 1日の原料 ${R.itemsToday}個</div>
        ${bossHTML(R)}
        ${specialHTML(R)}
      </div>

      <div class="section shop ${shopClosed ? 'closed' : ''}">
        <h3><button class="fold" id="btn-shop-fold" title="ショップを${shopClosed ? '開く' : '閉じる'}">${shopClosed ? '▸' : '▾'} ショップ${shopClosed ? `<span>（${R.shop.filter((s) => !s.sold).length}品）</span>` : ''}</button>
          ${shopClosed ? '' : `<button class="btn sub small" id="btn-reroll" ${R.freeRerolls <= 0 && R.coins < R.rerollCost ? 'disabled' : ''}>${rerollLabel}</button>`}</h3>
        ${shopClosed ? '' : `<div class="cards">${cards}</div>`}
      </div>
      <div class="section">
        <h3>設置枠 <span>${placed} / ${R.boardCap}${dayCap() < R.boardCap ? `（今日は${dayCap()}まで）` : ''}</span></h3>
        <button class="btn sub" id="btn-slot" ${R.coins < sCost ? 'disabled' : ''}>設置枠を増やす +1　<b style="color:var(--coin)">${sCost}枚</b></button>
      </div>
      <div class="section">
        <h3>手持ち <span>所持 ${owned} / ${oCap}台</span></h3>
        <div class="tray">${tray}</div>
        ${R.kits > 0 ? `<div class="kit-line">🔧 改造キット <b>${R.kits}個</b>：「+」「×」の機械を選んで「★改造」</div>` : ''}
      </div>
      <div class="tip">右クリック／<kbd>Esc</kbd>で選択解除。機械同士はクリックで入れ替え。</div>
      <div class="start-dock">
        ${placed > dayCap() ? `<div class="tip" style="color:var(--bad)">※ 設置枠は今日 ${dayCap()} まで。手持ちに戻してください</div>` : R.tray.length ? `<div class="tip" style="color:#ffb347">※ 手持ちの機械は稼働しません</div>` : ''}
        ${levOpen() && !R.hi ? leverageHTML(R) : ''}
        ${phaseDockHTML(R)}
        <button class="btn" id="btn-start">稼働開始 <span style="font-size:12px;opacity:.7">[Space]</span></button>
      </div>
    `;
    renderInfo(true);
  }

  function renderRun(R) {
    side.innerHTML = `
      <div class="section">
        <div class="layout-name">${R.hi ? `ハイスコアモード ・ DAY ${R.day} 稼働中（最終日 DAY ${R.hi.endDay}）` : `第${R.phase}期 ・ DAY ${R.day} 稼働中（納期 DAY ${R.deadline}）`}</div>
        ${bossHTML(R)}
      </div>
      <div class="section">
        <h3>本日の稼働</h3>
        <div class="stats">
          <span>今日の出荷</span><span class="v" id="rs-today">0</span>
          <span>投入</span><span class="v" id="rs-spawn">0</span>
          <span>最高価値</span><span class="v" id="rs-best">0</span>
          <span>連続出荷</span><span class="v" id="rs-combo">0</span>
          <span>複製</span><span class="v" id="rs-dup">0</span>
          <span>分裂</span><span class="v" id="rs-split">0</span>
          <span>消滅</span><span class="v" id="rs-destroy">0</span>
          <span>機械からのコイン</span><span class="v" id="rs-coins">+0</span>
        </div>
      </div>
      <div class="tip"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> で速度切替。機械にカーソルを合わせると詳細が出ます。</div>`;
    for (const k of Object.keys(hudCache)) if (k.startsWith('rs-')) delete hudCache[k];
    renderInfo(true);
  }

  // 置いた場所・持ちコインなどで決まる「今の効果」
  function stateNote(m) {
    const R = G.run;
    const adj = (pred) => adjMachineList(m.x, m.y).filter((o) => !offline(o) && pred(o)).length;
    const placed = m.x >= 0;
    switch (m.type) {
      case 'lottery': {
        if (!placed) return '';
        const p = Math.min(0.9, 0.15 + 0.25 * countAdjType(m.x, m.y, 'cat'));
        return `当選率 <b>${Math.round(p * 100)}%</b>`;
      }
      case 'cursed': {
        if (!placed) return '';
        return `消滅率 <b>${Math.round(cursedRisk(countAdjType(m.x, m.y, 'cat'), modOn('cursed')) * 100)}%</b>`;
      }
      case 'vault': {
        const lm = liveMult(m);
        return `持ちコイン ${R.coins}枚 → <b>×${lm ? fmtMult(Math.round(lm * 100) / 100) : 1}</b>`;
      }
      case 'twin':
        return placed ? (countAdjType(m.x, m.y, 'twin') + (modOn('twin') ? adj((o) => o.type !== 'twin' && MACHINES[o.type].hot) : 0) ? '隣に相方あり → <b>×2.5</b>' : '隣に相方なし → ×1.5') : '';
      case 'mason':
        return placed ? `隣のふるい ${countAdjType(m.x, m.y, 'sieve')}台 → 石なら <b>×${fmtMult(2 + 2.5 * countAdjType(m.x, m.y, 'sieve'))}</b>` : '';
      case 'bellows':
        return placed ? `隣の「炉」 <b>${adj((o) => MACHINES[o.type].hot)}台</b> の熱が+1` : '';
      case 'cat':
        return placed ? `隣の宝くじ機 ${countAdjType(m.x, m.y, 'lottery')}台・呪いの炉 ${countAdjType(m.x, m.y, 'cursed')}台` : '';
      case 'battery':
        return placed ? `隣の「N回ごと」の機械 <b>${adj((o) => MACHINES[o.type].charge)}台</b>` : '';
      case 'cooler':
        return placed ? `隣の「×」系の機械 <b>${adj((o) => MACHINES[o.type].kind === 'mult' || o.type === 'transmuter')}台</b>${!modOn('cooler') && adj((o) => MACHINES[o.type].hot) ? '　<b style="color:#ff8f8f">隣の炉は熱を出さない</b>' : ''}` : '';
      case 'amp':
        return placed ? `隣の「+」「×」の機械 <b>${adj((o) => canStar(o))}台</b> の効果が2倍` : '';
      case 'exchange': {
        const per = m.x >= 0 ? beltHits(m.x, m.y) : 0;
        return `持ちコイン ${R.coins}枚 → <b>×${fmtMult(Math.round((1 + R.coins / 20) * 10) / 10)}</b>${per ? `（アイテム1個につき${per}枚払う。原料${R.itemsToday}個なら1日で最大${per * R.itemsToday}枚）` : ''}`;
      }
      case 'prism': {
        if (!placed) return '';
        const n = new Set(adjMachineList(m.x, m.y).filter((o) => !offline(o)).map((o) => o.type)).size;
        return `隣の機械 ${n}種類 → <b>×${fmtMult(1 + (modOn('prism') ? 0.75 : 0.5) * n)}</b>`;
      }
      case 'alchemist': {
        const a = countPlaced('alchemist') || 1;
        return `錬金術師 ${a}台 → ランクが上がるたび <b>×${1 + 2 * a}</b>（錬金釜 ${countPlaced('transmuter')}台）`;
      }
      case 'transmuter': {
        const a = countPlaced('alchemist');
        return a ? `錬金術師 ${a}台：ランクが上がるたび <b>×${1 + 2 * a}</b>` : '';
      }
      case 'resonator':
        return countPlaced('splitter') + countPlaced('duplicator') || modOn('resonator') ? '' : '分裂ゲート・複製機がないので、今は +2 だけ';
      case 'artisan': {
        if (!placed) return '';
        const reps = beltHits(m.x, m.y);
        let f = 1;
        for (let k = 1; k <= reps; k++) f *= 1 + 0.5 * k * ampMul(m);
        return `1個に <b>${reps}回</b> 当たる → 合計 <b>×${fmtMult(Math.round(f * 10) / 10)}</b>（反響レール・強化マスでさらに増える）`;
      }
    }
    return '';
  }

  function machineInfoHTML(m) {
    const d = MACHINES[m.type];
    let extra = '';
    if (m.x >= 0) {
      const hits = beltHits(m.x, m.y);
      const amps = countAdjType(m.x, m.y, 'amp');
      const coolers = countAdjType(m.x, m.y, 'cooler');
      const parts = [];
      if (d.belt) {
        const k = pathIndex(m.x, m.y);
        parts.push(`ベルト ${k}/${G.run.path.length - 1}マス目`);
        if (m.type === 'echo') {
          const P = G.run.path;
          const set = new Set();
          for (let j = Math.max(0, k - 1); j <= Math.min(P.length - 1, k + 1); j++) {
            for (const o of adjMachineList(P[j][0], P[j][1])) if (!isBeltType(o.type) && MACHINES[o.type].apply) set.add(o);
          }
          const n = set.size;
          parts.push(`横の機械 <b>${n}台</b> が追加で発動`);
        } else parts.push('アイテム1個につき <b>1回</b> 発動');
      } else if (m.type === 'piggy' || m.type === 'alchemist') parts.push('どこに置いても効果あり');
      else if (d.kind === 'passive') parts.push('隣接する機械に常時効果');
      else parts.push(`アイテム1個につき <b>${hits}回</b> 発動`);
      if (amps && canStar(m)) parts.push(`<b style="color:#f7a8ff">増幅 効果×${1 + amps}</b>`);
      if (coolers && d.kind === 'mult') parts.push(`冷却 倍率+${coolers}`);
      const sp = machineSpecial(m);
      if (sp === 'boost') parts.push('<b style="color:#ffd447">★強化マス：発動+1</b>');
      if (sp === 'broken') parts.push('<b style="color:#ff6b6b">✕故障マス：今日は動かない</b>');
      if (d.charge) parts.push(`今は${chargeOf(m)}回ごと`);
      if (upkeepShort(m)) parts.push('<b style="color:#ff6b6b">維持費が足りない：このままだと今日は止まる</b>');
      extra = `<div class="meta">${parts.join(' ・ ')}</div>`;
    } else {
      extra = `<div class="meta">手持ち（未配置）${d.belt ? '：ベルトの上に置けます' : ''}</div>`;
    }
    const note = stateNote(m);
    if (note) extra += `<div class="meta" style="color:#ffd9a0">いま：${note}</div>`;
    if (m.star) extra += `<div class="meta" style="color:#ffd447">★改造 ×${m.star}：効果 +${Math.round(STAR_STEP * 100 * m.star)}%</div>`;
    const tl = tuneLv(m.type);
    if (tl && isTunable(m.type)) extra += `<div class="meta" style="color:#7fd6ff">研究「習熟」Lv${tl}：効果 +${Math.round(TUNE_STEP * 100 * tl)}%</div>`;
    // 研究した「追加効果」
    if (modOn(m.type)) extra += `<div class="mod-line"><b>追加効果「${d.mod.name}」</b>　${d.mod.desc}</div>`;
    const tags = (cellCount(m.type) > 1 ? '<span class="tag warn">大型：2マス・2枠</span>' : d.size > 1 && slotWeight(m) > 1 ? '<span class="tag warn">大型：2枠</span>' : '') + (upkeepOf(m) ? `<span class="tag warn">維持費 ${upkeepOf(m)}枚/日</span>` : '');
    return `<div class="hd">${glyphHTML(m.type, '', '', m.star)}<div><div class="nm">${d.name}
      <span class="rar" style="color:${RARITY[d.rarity].color};font-size:11px">${RARITY[d.rarity].name}</span></div>
      <div class="meta">${d.belt ? BELT_TAG + ' ' : ''}<span class="tag">${KIND_LABEL[d.kind]}</span>${tags}売値 ${sellValue(m)}枚</div></div></div>
      <div>${d.desc}</div>${extra}`;
  }

  // 機械の詳細：右の欄の上にポップアップで出す（盤面・手持ちの機械にカーソルを合わせる／選ぶと出る）
  let hoverTray = null; // カーソルを合わせている手持ちの機械
  function placePopup(el) {
    const r = side.getBoundingClientRect();
    const narrow = r.top > window.innerHeight * 0.5; // 狭い画面で右の欄が盤面の下にあるとき
    el.style.left = Math.max(8, r.left + 8) + 'px';
    el.style.width = Math.min(r.width - 16, window.innerWidth - 16) + 'px';
    if (narrow) {
      el.style.top = 'auto';
      el.style.bottom = '8px';
    } else {
      el.style.bottom = 'auto';
      el.style.top = Math.max(8, r.top + 8) + 'px';
    }
    el.style.maxHeight = (narrow ? window.innerHeight * 0.5 : r.height - 16) + 'px';
  }
  function renderInfo(force) {
    const el = $('info-pop');
    if (!el) return;
    const R = G.run;
    // ドラッグ中は詳細を出さない（指や盤面を隠さないように）
    const active = R && (G.state === 'build' || G.state === 'run') && overlay.classList.contains('hidden') && !(G.drag && G.drag.moved);
    const h = active ? G.hover : null;
    const selF = active && G.state === 'build' && R.sel != null ? findMachine(R.sel) : null;
    const hovM = h && inBounds(h.cx, h.cy) ? machineAt(h.cx, h.cy) : null;
    // カーソルを合わせている手持ちの機械（盤面に置いたあとや売ったあとは出さない）
    let trayF = active && hoverTray != null ? findMachine(hoverTray) : null;
    if (trayF && trayF.where !== 'tray') trayF = null;
    if (hoverTray != null && !trayF && (!R || !findMachine(hoverTray) || findMachine(hoverTray).where !== 'tray')) hoverTray = null;
    const sp = !hovM && h && G.state === 'build' && inBounds(h.cx, h.cy) ? specialAt(h.cx, h.cy) : null;
    const key = `${G.state}|${selF ? selF.m.uid + ':' + selF.m.x + ',' + selF.m.y + '*' + selF.m.star : ''}|${hovM ? hovM.uid : ''}|${trayF ? trayF.m.uid : ''}|${sp || ''}|${R ? R.coins + ':' + R.kits : ''}`;
    if (!force && key === infoKey) {
      if (!el.classList.contains('hidden')) placePopup(el);
      return;
    }
    infoKey = key;
    // 選択中 > 盤面でカーソルを合わせた機械 > 手持ちでカーソルを合わせた機械 > 特設マス
    let html = '';
    if (selF) {
      html = `<button class="pop-close" id="btn-unsel" title="選択解除（右クリック・Esc）">×</button>${machineInfoHTML(selF.m)}
        <div class="hint" style="margin-top:6px">置きたいマスをタップ（ドラッグでも動かせます）</div>
        <div class="row" style="margin-top:8px">
          <button class="btn sub small" id="btn-sell">売却 +${sellValue(selF.m)}枚</button>
          ${selF.where === 'grid' ? `<button class="btn sub small" id="btn-stash">手持ちに戻す</button>` : ''}
          ${cellCount(selF.m.type) > 1 ? `<button class="btn sub small" id="btn-rot">向きを変える <kbd>R</kbd></button>` : ''}
          ${R.kits > 0 && canStar(selF.m) ? `<button class="btn small" id="btn-kit">★改造する（キット残り${R.kits}）</button>` : ''}
        </div>`;
    } else if (hovM) {
      html = machineInfoHTML(hovM);
    } else if (trayF) {
      html = machineInfoHTML(trayF.m) + `<div class="hint" style="margin-top:6px">クリックで選んで、盤面に置く</div>`;
    } else if (sp) {
      html = sp === 'boost'
        ? '<div class="hint"><b style="color:#ffd447">★強化マス</b>：今日ここに置いた機械は発動回数が1増えます。</div>'
        : '<div class="hint"><b style="color:#ff6b6b">✕故障マス</b>：今日ここに置いた機械は動きません。</div>';
    }
    if (!html) {
      el.classList.add('hidden');
      return;
    }
    el.innerHTML = html;
    el.classList.toggle('pinned', !!selF);
    el.classList.remove('hidden');
    placePopup(el);
  }

  // ---------- オーバーレイ ----------
  function showTitle() {
    G.state = 'title';
    G.run = null;
    G.items = [];
    G.dirty = true;
    const b = G.meta.best;
    showOverlay(`
      <h1>コンベア錬金</h1>
      <p class="lead">ベルトの脇に機械を並べ、流れる原料を <b style="color:var(--accent)">足し算→掛け算</b> で膨らませろ。<br>${PHASE_DAYS}日ごとの納期までにノルマを出荷して、第${PHASES}期の完走をめざせ。研究を重ねてやっと届く、遠い大口取引。</p>
      ${devOn() ? '<p class="lead" style="color:#ff8f8f;font-weight:700">🛠 テストモード中：研究は「研究所」で自由にオンオフした内容で遊びます</p>' : ''}
      <div class="menu-btns">
        <button class="btn" data-act="new">出勤する</button>
        ${researchBtnHTML('研究所')}
        <button class="btn sub" data-act="trophies">実績 <span style="font-size:14px;color:var(--coin)">🏆 ${achCount()} / ${ACHIEVEMENTS.length}</span></button>
        <button class="btn sub" data-act="records">記録 <span style="font-size:14px;color:var(--muted)">最高 第${b.phase || 0}期</span></button>
        <div class="btn-row">
          <button class="btn sub" data-act="howto">遊び方</button>
          <button class="btn sub" data-act="tut-replay">チュートリアル</button>
        </div>
      </div>
      <p class="lead" style="margin-top:16px;font-size:12px">最高記録：第${b.phase || 0}期${b.phase >= PHASES ? '（完走）' : ''}${b.hiscore ? ` ・ ハイスコア ${fmt(b.hiscore)}` : ''} ・ 最高価値アイテム ${fmt(b.item || 0)} ・ 出勤回数 ${G.meta.runs}${b.lev ? ` ・ 最高レバレッジ Lv${b.lev}` : ''}</p>
    `);
  }
  function showHowTo() {
    showOverlay(`
      <h2>遊び方</h2>
      <p><b>1. 準備</b>：ショップで機械を買い、ベルトの<b>横のマス</b>に置く。アイテムが隣のベルトを通るたびに発動します。<br>
      2本のベルトに挟まれたマスは <b>2回</b>、角は <b>3回</b> 発動することも。</p>
      <p><b>ベルト型</b>：錬金釜・分裂ゲート・触媒槽などは<b>ベルトの上</b>に置きます。通ったアイテム1個につき<b>1回だけ</b>発動し、横の機械より先に効きます。ラインの<b>どこに置くか（前か後ろか）</b>で効き方が変わります。</p>
      <p><b>2. 設置枠と手持ち</b>：盤面に置けるのは最初5台。コインで枠を増やせます（値段は2.5倍ずつ）。<br>
      所持できるのは「設置枠 +2台」。置ききれない機械は手持ちで控えさせておけます。</p>
      <p><b>3. 稼働</b>：原料が流れ、機械が 変換 → 加算 → 乗算 → 特殊 の順に効果を出します。1日が終わると、基本の報酬と利息（5枚ごとに+1）がもらえます。</p>
      <p><b>4. 納期とノルマ</b>：ノルマは <b>期ごとの合計</b> です。納期は期が始まってから${PHASE_DAYS}日目（第1期は${PHASE_DAYS}日目）。その期の出荷額の合計がノルマに届いた日に <b>納期達成</b> となり、次の日から次の期が始まります。次の期の納期は、そこからまた${PHASE_DAYS}日目です。<br>
      早く達成すれば前倒しボーナスがもらえます。納期の日までに届かなければ解雇です。ノルマは大きく、期ごとの上がり幅も大きいので、盤面を育て続けましょう。<br>
      納期達成の報酬：コイン（期が進むほど多い）＋ 超過ボーナス（ノルマの2倍ごとに+1）＋ 前倒しボーナス（残り1日につき+${EARLY_COIN}）＋ 豪華な日報ボーナス。</p>
      <p><b>5. 毎日変わるもの</b>：2日目からは盤面に<b>特設マス</b>が出ます（★強化マス＝置いた機械が2回発動、✕故障マス＝置いた機械が止まる）。日が終わるたびに<b>日報ボーナス</b>を3つから1つ選べます（改造キット・機械・設置枠・ノルマ減など）。4日ごとに<b>ボス日</b>（特殊ルール）。</p>
      <p><b>組み合わせ</b>：1台では地味でも、組むと化ける機械がたくさんあります。説明文の「何に反応するか」に注目すると、機械どうしのつながりが見えてきます。自分だけの必勝パターンを見つけよう。</p>
      <p><b>素材ランク</b>：錬金釜（ベルト型）を1台通るごとに 石→銅→銀→金。出荷時に 銅×2 / 銀×4 / 金×8。</p>
      <p><b>完走とハイスコアモード</b>：ゴールは第${PHASES}期の納期。後の期ほどノルマが急に重くなり、研究なしではまず届きません。届かなかったランでも特許はたまるので、研究を進めて少しずつ遠くの期をめざします（後の期ほど、納期達成の特許も多い）。<br>
      完走したら <b>ハイスコアモード</b>（${HISCORE_DAYS}日間）に挑めます。ノルマはなく、出荷した合計がハイスコアとして記録されます。</p>
      <p><b>レバレッジ</b>（第3期まで届くと使える）：期の最初の日に、「稼働開始」ボタンの上の ◀ ▶ で Lv を決められます。1つ上げるごとに <b>その期のノルマ×${LEV_QMUL}</b>、そのかわり <b>納期達成のコイン+50%・特許+50%</b>。</p>
      <p><b>強い機械には代償</b>：大型（設置枠を2つ使う）、維持費（毎日コインを払う）、コインを払う、アイテムが消える…など。強い組み合わせほど、そろえるのが難しくなっています。</p>
      <p><b>研究所</b>：特許で、機械ごとの <b>習熟</b> を1段ずつ進められます。習熟を最後まで進めると、その機械の <b>追加効果</b>（新しい働き）を研究できます。新しい機械の設計図もここで。</p>
      <div class="menu-btns"><button class="btn sub" data-act="title">戻る</button></div>
    `);
  }
  // ---------- 研究所 ----------
  // 分類タブ → 段（左から 1段目・2段目・3段目）→ 機械ごとのカード。
  // カードの中に、その機械の道（設計図 → 習熟1〜5 → 追加効果）と、次の1段を研究する大きなボタンがある
  let resTab = 'work';
  // 機械1台ぶんの道：○が習熟の1段、★が追加効果。研究済みは光り、次の1段は点滅する
  function trackHTML(t) {
    const bp = MACHINES[t].locked ? 1 : 0;
    const l = rlv('m_' + t);
    const nodes = [];
    if (bp) nodes.push({ label: '図', on: l >= 1, cls: 'bp', tip: '設計図' });
    for (let k = 1; k <= MASTERY_MAX; k++) nodes.push({ label: k, on: l >= bp + k, cls: '', tip: `習熟 Lv${k}` });
    nodes.push({ label: '★', on: modOn(t), cls: 'mod', tip: `追加効果「${MACHINES[t].mod.name}」` });
    // 次に研究できる1段（段がまだ開いていない機械では光らせない）
    const next = tierOpen(researchTabOf(t), RESEARCH_TIER[t]) || devOn() ? nodes.findIndex((n) => !n.on) : -1;
    return `<div class="rtrack">${nodes.map((n, i) => `<i class="${n.cls} ${n.on ? 'on' : ''} ${i === next ? 'next' : ''}" title="${n.tip}">${n.label}</i>`).join('<s></s>')}</div>`;
  }
  // ボタン1つぶん（主ノード＝設計図/習熟、追加効果、経営・設備のノード）
  function researchBtn(r) {
    const l = rlv(r.id);
    const inf = !isFinite(r.max);
    const maxed = l >= r.max;
    const open = researchOpen(r);
    const cost = maxed ? 0 : r.cost(l);
    const dev = devOn();
    let title;
    let desc;
    if (r.kind === 'main') {
      const d = MACHINES[r.machine];
      const blueprint = d.locked && l === 0;
      const tl = tuneLv(r.machine);
      const shopNow = `並びやすさ +${Math.round(SHOP_STEP * 100 * tl)}%`;
      title = blueprint ? '設計図' : maxed ? `習熟 Lv${MASTERY_MAX}（最大）` : `習熟 Lv${tl + 1}`;
      desc = blueprint
        ? 'ショップに並ぶようになる'
        : isTunable(r.machine)
          ? `${maxed ? '' : `効果 <b>+${Math.round(TUNE_STEP * 100)}%</b>・ショップに並びやすさ <b>+${Math.round(SHOP_STEP * 100)}%</b>　`}（今：効果 +${Math.round(TUNE_STEP * 100 * tl)}%・${shopNow}）`
          : `${maxed ? '' : `ショップに並びやすさ <b>+${Math.round(SHOP_STEP * 100)}%</b>　`}（今：${shopNow}）`;
    } else if (r.kind === 'mod') {
      title = `追加効果「${MACHINES[r.machine].mod.name}」`;
      desc = r.desc;
    } else {
      title = r.name;
      desc = r.desc + (inf && l ? `（今 +${r.id === 'inf_prod' ? l * 10 + '%' : l + '枚'}）` : '');
    }
    const lv = r.max === 1 || r.kind === 'main' ? '' : `<span class="rb-lv">Lv ${l}${inf ? '' : ' / ' + r.max}</span>`;
    let state;
    let right;
    if (maxed) {
      state = 'maxed';
      right = '<span class="rb-cost done">✔ 済</span>';
    } else if (!open && !dev) {
      state = 'locked';
      const req = r.req && RESEARCH.find((x) => x.id === r.req);
      const short = req && rlv(req.id) < (r.reqLv || 1); // 前提がまだ足りない
      right = `<span class="rb-cost lock">🔒 ${!tierOpen(r.tab, r.tier) ? '段が未解放' : short ? (req.kind === 'main' ? `習熟 Lv${MASTERY_MAX} で解放` : '先に左') : '段が未解放'}</span>`;
    } else {
      state = dev || G.meta.patents >= cost ? 'can' : 'poor';
      right = `<span class="rb-cost">${dev ? '切替' : '特許 ' + cost}</span>`;
    }
    return `<button class="rbtn ${r.kind} ${state} ${l > 0 ? 'has' : ''} ${dev ? 'dev' : ''}" data-research="${r.id}" ${state === 'can' || dev ? '' : 'disabled'}>
      <span class="rb-body"><span class="rb-t">${title}${lv}</span><span class="rb-d">${desc}</span></span>${right}</button>`;
  }
  // 機械1台ぶんのカード
  function machineCard(t) {
    const d = MACHINES[t];
    const main = RESEARCH.find((r) => r.id === 'm_' + t);
    const mod = RESEARCH.find((r) => r.id === 'x_' + t);
    const locked = d.locked && !isUnlocked(t);
    return `<div class="rcard ${locked ? 'unowned' : ''}">
      <div class="rc-head">${glyphHTML(t)}<div class="rc-txt"><div class="rc-nm">${d.name}
        <span class="rar" style="color:${RARITY[d.rarity].color}">${RARITY[d.rarity].name}</span>${d.belt ? BELT_TAG : ''}${locked ? '<span class="rc-lock">未解放</span>' : ''}</div>
        <div class="rc-desc">${d.desc}</div></div></div>
      ${trackHTML(t)}
      ${researchBtn(main)}${researchBtn(mod)}</div>`;
  }
  function showResearch() {
    let done = 0;
    let total = 0;
    for (const r of RESEARCH) {
      if (!isFinite(r.max)) continue;
      done += Math.min(rlv(r.id), r.max);
      total += r.max;
    }
    const tabs = RESEARCH_TABS.map((t) => {
      const mine = RESEARCH.filter((r) => r.tab === t.id && isFinite(r.max));
      const got = mine.reduce((s, r) => s + Math.min(rlv(r.id), r.max), 0);
      const can = !devOn() && RESEARCH.some((r) => r.tab === t.id && rlv(r.id) < r.max && researchOpen(r) && G.meta.patents >= r.cost(rlv(r.id)));
      return `<button class="rtab ${resTab === t.id ? 'on' : ''}" data-act="res-tab" data-tab="${t.id}">${t.name}
        <span>${got} / ${mine.reduce((s, r) => s + r.max, 0)}</span>${can ? '<i class="dot"></i>' : ''}</button>`;
    }).join('');
    let body;
    if (resTab === 'gen') {
      // 経営・設備・物流：左から順に進める3本の列
      body = TREE_GENERAL.map((lane) => {
        const cells = RESEARCH.filter((r) => r.lane === lane.id).map((r) => `<div class="gcell">${researchBtn(r)}</div>`).join('<div class="garrow">▶</div>');
        return `<div class="glane"><div class="glane-n" style="color:${lane.color};border-color:${lane.color}">${lane.name}</div><div class="glane-row">${cells}</div></div>`;
      }).join('');
      body = `<p class="rhint">左から順に研究します（1つ前を研究すると次が開く）。いちばん右は上限のない研究です。</p>${body}`;
    } else {
      const prog = tabProgress(resTab);
      const cols = [1, 2, 3].map((tier) => {
        const open = tierOpen(resTab, tier) || devOn();
        const need = TIER_NEED[tier];
        const types = Object.keys(RESEARCH_TIER).filter((t) => RESEARCH_TIER[t] === tier && researchTabOf(t) === resTab);
        const head = open
          ? `<span class="tier-ok">${tier === 1 ? '最初から研究できる' : '開放済み'}</span>`
          : `<span class="tier-ng">🔒 この分類であと <b>${need - prog}</b> 段階研究すると開く</span>
             <div class="tier-bar"><i style="width:${Math.min(100, (prog / need) * 100)}%"></i></div>`;
        return `<div class="rcol ${open ? '' : 'closed'}"><div class="rcol-h"><b>${tier}段目</b>${head}</div>${types.map(machineCard).join('')}</div>`;
      });
      body = `<p class="rhint">機械ごとに1本の道があります。<b>習熟</b> を1段ずつ進め（ショップに並びやすくなり、「+」「×」の機械は効果も +${Math.round(TUNE_STEP * 100)}%ずつ）、
        最後まで進めると <b style="color:#f7a8ff">★追加効果</b>（その機械に新しい働きが付く）を研究できます。
        この分類で研究を進めるほど、右の段が開きます（今 <b>${prog}</b> 段階）。</p>
        <div class="rgrid">${cols.join('<div class="rgrid-arrow">▶</div>')}</div>`;
    }
    const refund = G.meta.researchRefund;
    if (refund != null) {
      delete G.meta.researchRefund;
      saveMeta();
    }
    // テストプレイ用：研究を自由にオンオフする砂場（完成版では DEV_TOOLS = false で消える）
    const dev = !DEV_TOOLS ? '' : `<div class="devbar ${devOn() ? 'on' : ''}">
        <button class="btn small ${devOn() ? '' : 'sub'}" data-act="dev-toggle">🛠 テストモード：${devOn() ? 'ON' : 'OFF'}</button>
        ${devOn()
          ? `<button class="btn small sub" data-act="dev-all">全部オン</button><button class="btn small sub" data-act="dev-none">全部オフ</button>
             <button class="btn small sub" data-act="dev-copy">本来の研究をコピー</button>
             <span>ボタンを押すたびに Lv が1つ上がり、最大の次は0に戻ります。特許は使いません。OFFにすると本来の研究に戻ります</span>`
          : '<span>研究を自由にオンオフしてテストプレイできます（本来の研究はそのまま残ります）</span>'}
      </div>`;
    showOverlay(`
      <div class="rhead"><h2>研究所</h2>
        <div class="patents">特許 ${G.meta.patents} <span style="font-size:12px;color:var(--muted);font-weight:500">・ 進み具合 ${done} / ${total}</span></div>
        <button class="btn sub small" data-act="title">戻る</button></div>
      ${refund != null ? `<p class="lead" style="color:var(--coin);font-weight:700">研究所を作り直しました。これまでの研究はリセットして、使った特許 ${refund} を全部返しています。</p>` : ''}
      ${dev}
      <div class="rtabs">${tabs}</div>
      ${body}
    `, 'wide');
  }

  // ---------- 実績 ----------
  function medalHTML(a, got) {
    const t = ACH_TIERS[a.tier];
    return `<div class="medal ${got ? '' : 'off'}" style="--mc:${t.color}">${got ? '🏆' : a.secret ? '？' : '🔒'}</div>`;
  }
  function showTrophies() {
    const got = achCount();
    const earned = ACHIEVEMENTS.filter((a) => hasAch(a.id)).reduce((s, a) => s + ACH_REWARD[a.tier], 0);
    const sections = ACH_CATS.map((c) => {
      const list = ACHIEVEMENTS.filter((a) => a.cat === c.id);
      const n = list.filter((a) => hasAch(a.id)).length;
      const cards = list.map((a) => {
        const ok = hasAch(a.id);
        const hide = a.secret && !ok;
        const date = ok ? new Date(G.meta.ach[a.id]).toLocaleDateString('ja-JP') : '';
        return `<div class="ach ${ok ? 'got' : ''} tier${a.tier}">${medalHTML(a, ok)}<div class="ach-body">
          <div class="n">${hide ? '？？？' : a.name} <span class="ach-tier" style="color:${ACH_TIERS[a.tier].color}">${ACH_TIERS[a.tier].name}</span></div>
          <div class="d">${hide ? 'ヒント：' + a.hint : a.desc}</div></div>
          <div class="ach-r">${ok ? `<span class="ach-date">${date}</span>` : `特許 +${ACH_REWARD[a.tier]}`}</div></div>`;
      }).join('');
      return `<h3 class="rs-cat">${c.name} <span style="color:var(--muted);font-size:12px">${n} / ${list.length}</span></h3>${cards}`;
    }).join('');
    showOverlay(`
      <h2>🏆 実績</h2>
      <div class="patents">${got} / ${ACHIEVEMENTS.length} 解除 ・ もらった特許 ${earned}</div>
      <p class="lead" style="font-size:12px">解除するとその場で特許がもらえます（銅+1・銀+2・金+3）。「？？？」はひみつの実績。ヒントの組み合わせを探してみよう。</p>
      <div class="research">${sections}</div>
      <div class="menu-btns"><button class="btn sub" data-act="title">戻る</button></div>
    `);
  }
  // 実績解除の通知（右上に積み重なって、数秒で消える）
  function achievement(a) {
    let box = $('ach-toasts');
    if (!box) {
      box = document.createElement('div');
      box.id = 'ach-toasts';
      document.body.appendChild(box);
    }
    const el = document.createElement('div');
    el.className = 'ach-toast';
    el.style.setProperty('--mc', ACH_TIERS[a.tier].color);
    el.innerHTML = `<div class="medal">🏆</div><div><div class="t">実績解除：${a.name}</div><div class="d">${a.desc}<br><b>特許 +${ACH_REWARD[a.tier]}</b></div></div>`;
    box.appendChild(el);
    Sfx.trophy();
    setTimeout(() => el.classList.add('out'), 4200);
    setTimeout(() => el.remove(), 4800);
  }

  // 1日の終わりの画面。納期を達成した日は、納期達成の報酬と次の期の予告も出す
  function showResult(firstWin) {
    const R = G.run;
    const rw = R.lastReward;
    const c = rw.clear;
    const recs = rw.records || [];
    const nb = (k) => (recs.includes(k) ? ' <span class="rec-badge">自己ベスト更新</span>' : '');
    const coinRows = [
      [`今日の報酬${R.boss ? '（ボス日）' : ''}`, `+${rw.base}枚`],
      ['利息', `+${rw.interest}枚`],
    ];
    if (rw.piggy) coinRows.push(['貯金箱', `+${rw.piggy}枚`]);
    if (rw.cashback) coinRows.push(['換金機のキャッシュバック', `+${rw.cashback}枚`]);
    if (c) {
      coinRows.push([`<b style="color:var(--coin)">納期達成</b>（第${c.phase}期）`, `+${c.bonus}枚`]);
      coinRows.push([`超過ボーナス（ノルマの ${ratioTxt(c.ratio)}）${nb('ratio')}`, `+${c.over}枚`]);
      if (c.early) coinRows.push([`前倒しボーナス（納期の${c.daysLeft}日前）`, `+${c.early}枚`]);
      if (rw.lev) coinRows.push([`レバレッジ Lv${rw.lev}（納期達成＋超過 +${Math.round((levCoinMul(rw.lev) - 1) * 100)}%）`, `+${c.levBonus}枚`]);
    }
    const infoRows = [['最高価値アイテム' + nb('item'), fmt(R.dayStats.best)]];
    if (recs.includes('dayScore')) infoRows.unshift(['1日の出荷額' + nb('dayScore'), fmt(R.dayScore)]);
    if (c && recs.includes('lev')) infoRows.push(['レバレッジ' + nb('lev'), 'Lv' + rw.lev]);
    const ptNote = c && rw.lev ? `レバレッジ +${Math.round((levPatentMul(rw.lev) - 1) * 100)}%` : '';
    const pts = rw.dayPts + (c ? c.pts : 0);
    infoRows.push([`特許（${c ? '今日ぶん＋納期達成' : '今日ぶん'}${ptNote ? '・' + ptNote : ''}）`, `+${fmtMult(Math.round(pts * 100) / 100)}`]);
    if (R.dayStats.maxCombo >= 5) infoRows.push(['最大連続出荷', R.dayStats.maxCombo + '連']);
    const t0 = 0.8;
    const step = 0.2;
    const lines =
      coinRows.map((r, i) => `<div class="result-line anim" style="--d:${t0 + i * step}s"><span>${r[0]}</span><span class="v">${r[1]}</span></div>`).join('') +
      infoRows.map((r, i) => `<div class="result-line anim" style="--d:${t0 + (coinRows.length + i) * step}s"><span>${r[0]}</span><span class="v" style="color:var(--text)">${r[1]}</span></div>`).join('');
    // 今日の出荷額と、今の期の進み具合
    const prog = Math.min(1, R.phaseScore / R.quota);
    const note = c
      ? `納期達成！${c.daysLeft > 0 ? `　納期の${c.daysLeft}日前なので、前倒しボーナスがもらえます` : ''}`
      : `あと <b>${fmt(rw.need)}</b>　／　納期まで あと${rw.daysLeft}日${rw.daysLeft === 1 ? '（明日が納期）' : ''}`;
    const big = `<div class="result-big good"><span class="rb-l">今日の出荷</span><span id="count-up">0</span></div>
      <div class="phase-prog ${c ? 'done' : ''}">
        <div class="pp-row"><span>第${R.phase}期の合計</span><span><b>${fmt(R.phaseScore)}</b> / ${fmt(R.quota)}</span></div>
        <div class="pp-bar"><div style="width:${(prog * 100).toFixed(1)}%"></div></div>
        <div class="pp-note">${note}</div>
      </div>`;
    const tutNote = R.tut && R.day === 1
      ? `<div class="tut-note"><b>これが1日の流れです。</b>ノルマは期ごとの合計で、納期（${PHASE_DAYS}日目）までに届けば次の期へ進みます。届かなかった日も、コインと日報ボーナスはもらえます。日報ボーナスを1つ選んで、次の日へ。</div>`
      : '';
    if (firstWin) {
      showOverlay(`
        <h2 style="color:var(--coin)">🏆 第${PHASES}期の納期達成！ 完走です</h2>
        ${big}
        ${lines}
        <div class="hi-invite">
          <div class="t">このまま <b>ハイスコアモード</b> に挑めます</div>
          <div class="d">ノルマなしの ${HISCORE_DAYS}日間で、出荷した合計がハイスコアになります（落ちることはありません）。${G.meta.best.hiscore ? `自己ベストは <b>${fmt(G.meta.best.hiscore)}</b>。` : ''}<br>
          最後に、1兆を超えた桁の数だけ特許がもらえます。</div>
        </div>
        ${tipHTML()}
        <div class="menu-btns">
          <button class="btn" data-act="hiscore">ハイスコアモードに挑む（${HISCORE_DAYS}日間）</button>
          <button class="btn sub" data-act="retire">ここで退職する（特許 +${patentsFor(R)}）</button>
        </div>`);
    } else if (R.hi) {
      // ハイスコアモードの1日の終わり
      const best = R.hi.best;
      const over = best > 0 && R.phaseScore > best;
      const hiBig = `<div class="result-big good"><span class="rb-l">今日の出荷</span><span id="count-up">0</span></div>
        <div class="phase-prog ${over ? 'done' : ''}">
          <div class="pp-row"><span>ハイスコア（合計）</span><span><b>${fmt(R.phaseScore)}</b>${best > 0 ? ` / 自己ベスト ${fmt(best)}` : ''}</span></div>
          ${best > 0 ? `<div class="pp-bar"><div style="width:${(Math.min(1, R.phaseScore / best) * 100).toFixed(1)}%"></div></div>` : ''}
          <div class="pp-note">${R.hi.done ? (R.hi.newBest ? '🎉 ハイスコア 自己ベスト更新！' : 'ハイスコアモード終了') : over ? '自己ベストを超えています！' : `あと${rw.daysLeft}日`}</div>
        </div>`;
      if (R.hi.done) {
        showOverlay(`
          <h2 style="color:var(--coin)">🏁 ハイスコアモード終了</h2>
          ${hiBig}
          ${lines}
          <div class="result-line anim" style="--d:1.6s"><span>ハイスコアの特許（1兆を超えた桁の数）</span><span class="v" style="color:var(--blue)">+${R.hi.bonus}</span></div>
          ${tipHTML()}
          <div class="menu-btns"><button class="btn" data-act="hi-finish">結果を見る</button></div>`);
      } else {
        showOverlay(`
          <h2>ハイスコアモード DAY ${R.day}</h2>
          ${hiBig}
          ${lines}
          ${nextDayHTML(R)}
          ${tipHTML()}
          ${rewardsHTML(R)}`);
      }
    } else {
      showOverlay(`
        <h2 ${c ? 'style="color:var(--coin)"' : ''}>${c ? `🎉 第${c.phase}期 納期達成！` : `DAY ${R.day} 終了`}</h2>
        ${tutNote}
        ${big}
        ${lines}
        ${nextDayHTML(R)}
        ${tipHTML()}
        ${rewardsHTML(R)}`);
    }
    countUp($('count-up'), R.dayScore, 0.7);
    coinRows.forEach((_, i) => setTimeout(() => Sfx.coin(), (t0 + i * step) * 1000));
  }
  // 日報ボーナス：1つ選ぶと次の日へ
  function rewardsHTML(R) {
    if (!R.rewards || !R.rewards.length) return `<div class="menu-btns"><button class="btn" data-act="next">次の日へ</button></div>`;
    const cards = R.rewards.map((rw, i) => {
      const t = rewardText(rw);
      const g = rw.id === 'machine' ? glyphHTML(rw.type) : `<div class="glyph reward-ico">${REWARD_ICON[rw.id] || '？'}</div>`;
      return `<button class="reward" data-reward="${i}">${g}<div><div class="name">${t.t}</div><div class="desc">${t.d}</div></div></button>`;
    }).join('');
    const big = R.rewards[0] && R.rewards[0].big;
    return `<h3 class="reward-h">${big ? '🎁 納期達成の日報ボーナス（いつもより豪華）' : '📋 日報ボーナス'}：1つ選んで次の日へ</h3><div class="rewards">${cards}</div>`;
  }
  const REWARD_ICON = { coins: '¥', kit: '🔧', slot: '＋', patent: '特', quota: '↓', shop: '店', reroll: '↻' };

  // 明日の予告（ボス日）と、納期を達成した日は次の期のノルマ
  function nextDayHTML(R) {
    const d = R.day + 1;
    const c = R.lastReward && R.lastReward.clear;
    const boss = (d % 4 === 0)
      ? `<div class="boss" style="margin-top:12px"><div class="t">⚠ 明日はボス日</div><div class="d">特殊ルールは明日の準備画面で発表されます</div></div>`
      : '';
    if (!c) return boss;
    const p = R.phase + 1;
    return `${boss}<p class="lead next-phase">次は <b>第${p}期</b>：ノルマ <b>${fmt(runQuota(p))}</b>（今の ${fmtMult(Math.round((runQuota(p) / R.quota) * 10) / 10)}倍）<br>
      納期は DAY ${deadlineFrom(R.day + 1)}。明日から <b>${PHASE_DAYS}日</b> あります</p>`;
  }
  // 研究所へのボタン。研究できるものがあれば、光って目立つ大きなボタンになる
  function researchBtnHTML(label, big) {
    const n = researchAvail();
    const gap = nextResearchGap();
    if (n > 0) {
      return `<button class="btn research-go ${big ? 'big' : ''}" data-act="research">
          <span class="rg-ico">🔬</span><span class="rg-body"><b>${label}へ</b><span>いま研究できるもの <b>${n}件</b> ・ 特許 ${G.meta.patents}</span></span>
          <span class="rg-badge">研究できる！</span></button>`;
    }
    return `<button class="btn sub" data-act="research">🔬 ${label} <span class="patents" style="font-size:14px">特許 ${G.meta.patents}</span>${gap ? `<span class="rg-gap">次の研究まで あと${gap}</span>` : ''}</button>`;
  }
  // 次に研究できるようになるまで、あと何特許か（いちばん安い研究で）
  function nextResearchGap() {
    let min = Infinity;
    for (const r of RESEARCH) {
      const l = rlv(r.id);
      if (l < r.max && researchOpen(r)) min = Math.min(min, r.cost(l));
    }
    return isFinite(min) && min > G.meta.patents ? min - G.meta.patents : 0;
  }
  function showGameOver(gained, reason) {
    const R = G.run;
    const failed = reason === 'fail';
    const hiDone = reason === 'hiscore';
    const title = failed ? '納期に間に合わず…解雇されました' : hiDone ? '🏁 ハイスコアモード終了' : reason === 'retire' ? '円満退職！' : 'このランを終了しました';
    const canResearch = researchAvail() > 0;
    showOverlay(`
      <h2 style="color:${failed ? 'var(--bad)' : 'var(--coin)'}">${title}</h2>
      ${failed ? `<div class="result-big bad"><span class="rb-l">第${R.phase}期の合計</span>${fmt(R.phaseScore)} <span style="font-size:18px;color:var(--muted)">/ ${fmt(R.quota)}</span></div>` : ''}
      ${hiDone ? `<div class="result-big good"><span class="rb-l">ハイスコア</span>${fmt(R.hi.total || 0)}${R.hi.newBest ? ' <span class="rec-badge">自己ベスト更新</span>' : ''}</div>` : ''}
      <div class="patent-gain">
        <span class="pg-l">獲得した特許${R.stats.levSum ? `（レバレッジ合計 ${R.stats.levSum}）` : ''}</span>
        <span class="pg-v">+<span id="patent-up">0</span></span>
        <span class="pg-s">特許の合計 <b>${G.meta.patents}</b></span>
      </div>
      <div class="result-line"><span>達成した納期</span><span class="v" style="color:var(--text)">第${R.stats.phasesCleared}期まで（${R.stats.days}日）${R.stats.phasesCleared >= PHASES ? ' ・ 完走' : ` ・ ゴールの第${PHASES}期まで あと${PHASES - R.stats.phasesCleared}期`}</span></div>
      <div class="result-line"><span>最高価値アイテム</span><span class="v" style="color:var(--text)">${fmt(R.stats.bestItem)}</span></div>
      <div class="result-line"><span>総出荷額</span><span class="v" style="color:var(--text)">${fmt(R.stats.totalShipped)}</span></div>
      ${R.newRecords && R.newRecords.length ? `<p class="lead rec-line">🎉 自己ベスト更新：${R.newRecords.map((k) => RECORD_NAMES[k]).join('・')}</p>` : ''}
      ${R.newAch && R.newAch.length ? `<p class="lead" style="color:var(--coin);font-weight:900">🏆 このランで解除した実績：${R.newAch.map((id) => ACHIEVEMENTS.find((a) => a.id === id).name).join('・')}</p>` : ''}
      ${canResearch ? `<p class="lead go-hint">特許がたまりました。研究で機械を育てると、もっと先の期に届きます</p>` : ''}
      <div class="menu-btns over-btns">
        ${canResearch ? researchBtnHTML('研究所', true) : ''}
        <button class="btn ${canResearch ? 'sub again' : ''}" data-act="new">▶ もう一度出勤する</button>
        ${canResearch ? '' : researchBtnHTML('研究所')}
        <div class="btn-row">
          <button class="btn sub" data-act="trophies">🏆 実績 ${achCount()} / ${ACHIEVEMENTS.length}</button>
          <button class="btn sub" data-act="records">📈 記録</button>
        </div>
        <div class="btn-row">
          <button class="btn sub" data-act="copy-result">結果をコピー</button>
          <button class="btn sub" data-act="title">タイトルへ</button>
        </div>
      </div>
      ${tipHTML()}`);
    const el = $('patent-up');
    if (el) countUp(el, gained, 0.9);
  }

  // ---------- ヒント（日の終わりの画面） ----------
  let lastTip = -1;
  function tipHTML() {
    // レバレッジがまだ使えないうち（はじめて完走する前）は、レバレッジの話は出さない
    const pool = TIPS.map((t, i) => i).filter((i) => levOpen() || !TIPS[i].includes('レバレッジ'));
    let i = pool[Math.floor(Math.random() * pool.length)];
    if (i === lastTip) i = pool[(pool.indexOf(i) + 1) % pool.length];
    lastTip = i;
    return `<div class="tipbox"><b>💡 ヒント</b><span>${TIPS[i]}</span></div>`;
  }

  // ---------- 記録（自己ベストと最近のラン） ----------
  const RECORD_NAMES = { hiscore: 'ハイスコア', phase: '達成した納期', day: '到達した日', item: '最高価値アイテム', dayScore: '1日の出荷額', ratio: '超過倍率', lev: 'レバレッジ', total: '1ランの総出荷額', patents: '1ランの特許' };
  const fmtDate = (t) => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  const ratioTxt = (r) => '×' + (r >= 1000 ? fmt(r) : (r || 0).toFixed(1));
  function runResult(h) {
    // 納期制になってからのラン（phases がある）
    if (h.phases != null) {
      if (h.win && h.hi != null) return `完走＋ハイスコア ${fmt(h.hi)}`;
      if (h.win && h.phases > PHASES) return `完走＋エンドレス 第${h.phases}期（前のルール）`;
      if (h.win) return `完走（${h.days}日）`;
      return h.reason === 'fail' ? `第${h.phases + 1}期で解雇` : `第${h.phases + 1}期で終了`;
    }
    if (h.win) return '完走（前のルール）';
    return h.reason === 'fail' ? `DAY ${h.days + 1} で解雇（前のルール）` : `DAY ${h.days} で終了（前のルール）`;
  }
  function boardSummary(types) {
    const n = {};
    for (const t of types) n[t] = (n[t] || 0) + 1;
    return Object.entries(n).sort((a, b) => b[1] - a[1]).map(([t, k]) => MACHINES[t].name + (k > 1 ? '×' + k : '')).join(' ');
  }
  function shareText(h) {
    return [
      `コンベア錬金：${runResult(h)}${h.dev ? '（テストモード）' : ''}`,
      `最高価値アイテム ${fmt(h.item)} ／ 1日の最高出荷額 ${fmt(h.day)}${h.lev ? ` ／ 最高レバレッジ Lv${h.lev}` : ''}`,
      `ライン：${h.layout} ／ 最後の盤面：${boardSummary(h.board) || 'なし'}`,
    ].join('\n');
  }
  function bestText() {
    const b = G.meta.best;
    return [
      'コンベア錬金の自己ベスト',
      `最高 第${b.phase || 0}期${b.phase >= PHASES ? '（完走）' : ''} ／ 完走 ${G.meta.wins || 0}回（出勤 ${G.meta.runs}回）${b.hiscore ? ` ／ ハイスコア ${fmt(b.hiscore)}` : ''}`,
      `最高価値アイテム ${fmt(b.item || 0)} ／ 1日の最高出荷額 ${fmt(b.dayScore || 0)} ／ 最高レバレッジ Lv${b.lev || 0}`,
    ].join('\n');
  }
  function copyText(text, btn) {
    const done = (ok) => {
      const old = btn.textContent;
      btn.textContent = ok ? 'コピーしました' : 'コピーできませんでした';
      setTimeout(() => { btn.textContent = old; }, 1600);
    };
    if (!text) return done(false);
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => done(true), () => done(fallbackCopy(text)));
    else done(fallbackCopy(text));
  }
  // file:// で開いたときなど、clipboard API が使えない場合
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    ta.remove();
    return ok;
  }
  function showRecords() {
    const b = G.meta.best;
    const cards = [
      ['達成した納期', `第${b.phase || 0}期`, (b.phase || 0) >= PHASES ? '完走あり' : `ゴールの第${PHASES}期まで あと ${PHASES - (b.phase || 0)}期`],
      ['ハイスコア', b.hiscore ? fmt(b.hiscore) : '-', '完走したあとのハイスコアモード'],
      ['完走', `${G.meta.wins || 0}回`, `出勤 ${G.meta.runs}回`],
      ['最高価値アイテム', fmt(b.item || 0), 'アイテム1個の価値'],
      ['1日の出荷額', fmt(b.dayScore || 0), '1日でいちばん多く出荷した額'],
      ['超過倍率', ratioTxt(b.ratio), '納期のノルマの何倍出荷したか'],
      ['最高レバレッジ', `Lv ${b.lev || 0}`, '納期を達成したレバレッジ'],
      ['1ランの総出荷額', fmt(b.total || 0), ''],
      ['1ランの特許', `${b.patents || 0}`, ''],
    ].map(([n, v, s]) => `<div class="rec-card"><div class="rec-n">${n}</div><div class="rec-v">${v}</div><div class="rec-s">${s}</div></div>`).join('');
    const hist = G.meta.history || [];
    const rows = hist.length
      ? hist.map((h) => `<div class="hist-row ${h.win ? 'win' : ''}">
          <div class="hist-when">${fmtDate(h.t)}${h.dev ? ' 🛠' : ''}<span>${h.layout}</span></div>
          <div class="hist-res">${runResult(h)}</div>
          <div class="hist-num"><span>最高アイテム</span>${fmt(h.item)}</div>
          <div class="hist-num"><span>レバレッジ</span>${h.lev ? 'Lv' + h.lev : '-'}</div>
          <div class="hist-num"><span>特許</span>+${h.patents}</div>
          <div class="hist-board" title="${boardSummary(h.board)}">${h.board.map((t) => glyphHTML(t, 'mini')).join('')}</div>
        </div>`).join('')
      : '<p class="lead">まだ記録がありません。出勤すると、ここに最近のランが残ります。</p>';
    showOverlay(`
      <h2>記録</h2>
      <h3 class="rs-cat">自己ベスト</h3>
      <div class="rec-grid">${cards}</div>
      ${devOn() ? '<p class="lead" style="font-size:12px;color:#ff8f8f">🛠 テストモード中のランは、自己ベストに数えません（履歴には 🛠 付きで残ります）</p>' : ''}
      <h3 class="rs-cat">最近のラン <span style="color:var(--muted);font-size:12px">最新 ${HISTORY_MAX} 回まで</span></h3>
      <div class="hist">${rows}</div>
      <div class="menu-btns">
        <button class="btn sub" data-act="copy-best">自己ベストをコピー</button>
        <button class="btn sub" data-act="title">戻る</button>
      </div>`, 'wide');
  }

  function showPause() {
    const R = G.run;
    showOverlay(`
      <h2>一時停止</h2>
      <div class="menu-btns">
        <button class="btn" data-act="resume">続ける</button>
        <button class="btn sub danger" data-act="quit">このランをやめる（特許 +${patentsFor(R)}）</button>
      </div>`);
  }

  // ---------- 操作 ----------
  function doStart() {
    if (G.state !== 'build') return;
    const res = startDay();
    if (res === 'limit') {
      Sfx.error();
      banner(`設置枠は今日 ${dayCap()} まで`, 'bad');
      return;
    }
    Sfx.click();
    banner(`DAY ${G.run.day} 稼働開始`);
  }

  function onOverlayClick(e) {
    const btn = e.target.closest('[data-act],[data-research],[data-reward]');
    if (!btn) return;
    Sfx.unlock();
    Sfx.click();
    if (btn.dataset.act === 'res-tab') {
      resTab = btn.dataset.tab;
      showResearch();
      card.scrollTop = 0;
      return;
    }
    if (btn.dataset.act && btn.dataset.act.startsWith('dev-') && DEV_TOOLS) {
      const act = btn.dataset.act;
      if (act === 'dev-toggle') {
        G.meta.dev.on = !G.meta.dev.on;
        saveMeta();
      } else if (act === 'dev-all') devSetAll(true);
      else if (act === 'dev-none') devSetAll(false);
      else if (act === 'dev-copy') {
        G.meta.dev.research = { ...G.meta.research };
        saveMeta();
      }
      const scroll = card.scrollTop;
      showResearch();
      card.scrollTop = scroll;
      return;
    }
    if (btn.dataset.research) {
      // カードのボタンを押したら、その場で研究する。テストモードでは Lv を1つ上げる（最大の次は0）
      const scroll = card.scrollTop;
      const r = RESEARCH.find((x) => x.id === btn.dataset.research);
      if (devOn()) {
        const max = isFinite(r.max) ? r.max : 5;
        devSetResearch(r.id, rlv(r.id) >= max ? 0 : rlv(r.id) + 1);
      } else if (buyResearch(r.id)) Sfx.buy();
      else Sfx.error();
      showResearch();
      card.scrollTop = scroll;
      return;
    }
    if (btn.dataset.reward != null) {
      const rw = G.run.rewards && G.run.rewards[+btn.dataset.reward];
      if (!rw || !chooseReward(+btn.dataset.reward)) return;
      Sfx.buy();
      hideOverlay();
      nextDay();
      banner(G.run.boss ? `ボス日：${G.run.boss.name}` : `DAY ${G.run.day}`, !!G.run.boss);
      return;
    }
    const prev = G.state;
    switch (btn.dataset.act) {
      case 'new':
        // はじめての人には、先にチュートリアルの説明を出す
        if (tutPending()) {
          showTutorialIntro();
          break;
        }
        hideOverlay();
        newRun();
        banner('DAY 1');
        break;
      case 'tut-replay':
        G.meta.tut = 'todo';
        saveMeta();
        showTutorialIntro();
        break;
      case 'tut-skip':
        finishTutorial();
        hideOverlay();
        newRun();
        banner('DAY 1');
        break;
      case 'tut-start':
        hideOverlay();
        newRun();
        banner('DAY 1');
        break;
      case 'research':
        if (G.state === 'over') showTitleSilently();
        showResearch();
        break;
      case 'howto':
        showHowTo();
        break;
      case 'records':
        if (G.state === 'over') showTitleSilently();
        showRecords();
        break;
      case 'copy-result':
        copyText(G.meta.history[0] ? shareText(G.meta.history[0]) : '', btn);
        break;
      case 'copy-best':
        copyText(bestText(), btn);
        break;
      case 'trophies':
        if (G.state === 'over') showTitleSilently();
        showTrophies();
        break;
      case 'title':
        showTitle();
        break;
      case 'next':
        hideOverlay();
        nextDay();
        if (G.run.boss) banner(`ボス日：${G.run.boss.name}`, true);
        break;
      case 'hiscore':
        // 完走したあと：ハイスコアモードを始める
        startHiscore();
        hideOverlay();
        nextDay();
        banner('ハイスコアモード');
        break;
      case 'hi-finish':
        hideOverlay();
        endRun('hiscore');
        break;
      case 'retire':
        hideOverlay();
        endRun('retire');
        break;
      case 'resume':
        hideOverlay();
        G.state = G.pausedFrom || 'build';
        G.dirty = true;
        break;
      case 'quit':
        G.state = G.pausedFrom || 'build';
        endRun('quit');
        break;
    }
    void prev;
  }
  function showTitleSilently() {
    G.state = 'title';
    G.run = null;
    G.items = [];
    G.dirty = true;
  }

  function onSideClick(e) {
    const R = G.run;
    if (!R || G.state !== 'build') return;
    Sfx.unlock();
    const shopBtn = e.target.closest('[data-shop]');
    if (shopBtn) {
      const res = buyShop(+shopBtn.dataset.shop);
      if (res === 'ok') Sfx.buy();
      else {
        Sfx.error();
        if (res === 'cap') banner('所持の上限です', true);
        else if (res === 'coins') banner('コイン不足', true);
      }
      return;
    }
    const trayEl = e.target.closest('[data-tray]');
    if (trayEl) {
      const uid = +trayEl.dataset.tray;
      R.sel = R.sel === uid ? null : uid;
      Sfx.click();
      G.dirty = true;
      return;
    }
    const id = e.target.closest('button') && e.target.closest('button').id;
    if (id === 'btn-shop-fold') {
      shopClosed = !shopClosed;
      try { localStorage.setItem(UI_KEY, JSON.stringify({ shopClosed })); } catch (err) { /* 保存できなくても動く */ }
      Sfx.click();
      G.dirty = true;
    } else if (id === 'btn-reroll') {
      if (reroll()) Sfx.buy();
      else Sfx.error();
    } else if (id === 'btn-slot') {
      if (buySlot()) {
        Sfx.milestone(1);
        banner(`設置枠 ${G.run.boardCap}台に！`);
      } else Sfx.error();
    } else if (id === 'btn-start') {
      doStart();
    } else if (id === 'btn-lev-up' || id === 'btn-lev-down') {
      setLeverage((R.lev || 0) + (id === 'btn-lev-up' ? 1 : -1));
      Sfx.click();
    } else if (id === 'btn-unsel') {
      R.sel = null;
      G.dirty = true;
    } else if (id === 'btn-sell') {
      if (sellSelected()) Sfx.coin();
    } else if (id === 'btn-stash') {
      stashSelected();
      Sfx.click();
    } else if (id === 'btn-rot') {
      if (rotateMachine(R.sel)) Sfx.click();
      else {
        Sfx.error();
        banner('回すとはみ出すか、ほかの機械と重なります', 'bad');
      }
      infoKey = '';
    } else if (id === 'btn-kit') {
      if (applyKit(R.sel)) {
        Sfx.milestone(2);
        const f = findMachine(R.sel);
        banner(`${MACHINES[f.m.type].name} ★${f.m.star}`);
        if (f.where === 'grid') {
          const { x: cx, y: cy } = machineCenter(f.m);
          burst(cx, cy, '#ffd447', 24);
          addRing(cx, cy, '#ffd447', 2);
          f.m.flash = 1;
        }
        infoKey = '';
      } else Sfx.error();
    }
  }

  // ---------- 盤面のタップ（クリック） ----------
  // 持っている機械があれば、そのマスに置く。なければ、そのマスの機械を選ぶ
  function tapCell(cx, cy) {
    const R = G.run;
    if (!R || G.state !== 'build' || !inBounds(cx, cy)) return;
    if (R.sel != null) {
      const other = machineAt(cx, cy);
      const res = placeAt(R.sel, cx, cy);
      if (res === 'ok') {
        placedFx(R.sel);
        R.sel = null;
        G.dirty = true;
      } else if ((res === 'need-side' || res === 'need-belt' || res === 'blocked') && other && other.uid !== R.sel) {
        // 置けない場所にある機械をタップしたら、そちらを選び直す
        R.sel = other.uid;
        Sfx.click();
        G.dirty = true;
      } else placeError(res, true);
      return;
    }
    const m = machineAt(cx, cy);
    if (m) {
      R.sel = m.uid;
      Sfx.click();
      G.dirty = true;
    }
  }
  function placedFx(uid) {
    const f = findMachine(uid);
    Sfx.place();
    if (f && f.where === 'grid') {
      const c = machineCenter(f.m);
      burst(c.x, c.y, '#ffffff', 10);
    }
  }
  // 置けなかったときの知らせ。deselect：横置きの機械でベルトや出入口をタップしたら選択を外す
  function placeError(res, deselect) {
    const R = G.run;
    if (res === 'full') {
      Sfx.error();
      banner('設置枠がいっぱい', 'bad');
    } else if (res === 'blocked') {
      Sfx.error();
      banner('ここには置けません（2マス空いていない／大型の機械とは入れ替えられない）', 'bad');
    } else if (res === 'need-belt') {
      Sfx.error();
      banner('ベルト型はベルトの上に置く', 'bad');
    } else if (res === 'need-side') {
      Sfx.error();
      if (!deselect) banner('この機械はベルトの横に置く', 'bad');
      else {
        R.sel = null;
        G.dirty = true;
      }
    } else if (deselect) {
      R.sel = null;
      G.dirty = true;
    }
  }

  // ---------- ドラッグ＆ドロップ（マウス・タッチ共通） ----------
  // 押した瞬間を press に記録して、少し動かしたらドラッグ、動かさずに離したらタップとして扱う
  //   kind: 'canvas'（盤面の空きマス）| 'grid'（盤面の機械）| 'tray'（手持ち）| 'shop'（ショップの品）
  // ドラッグ中は G.drag = { uid, type, rot, moved }（描画が置いたときの見え方を出すのに使う）
  let press = null;
  let suppressClick = false;
  let ghost = null;
  function rectHas(el, e) {
    const r = el.getBoundingClientRect();
    return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  }
  function beginPress(e, info) {
    // 前のドラッグの後始末が残っていたら片付けてから（指を離したことが届かなかったとき）
    if (press || ghost || G.drag) cancelDrag();
    hoverTray = null;
    press = { ...info, id: e.pointerId, sx: e.clientX, sy: e.clientY, moved: false, touch: e.pointerType !== 'mouse' };
  }
  function moveGhost(e) {
    if (!ghost) return;
    ghost.style.left = e.clientX + 'px';
    ghost.style.top = e.clientY + 'px';
    // 盤面の上では、盤面に置いたときの見え方を描くので、指の下の小さな絵は消す
    ghost.classList.toggle('on-board', rectHas(canvas, e));
    ghost.classList.toggle('stash', press && press.kind === 'grid' && rectHas(side, e));
  }
  function dropGhost() {
    // 何かの拍子に2つ以上できていても、全部消す
    for (const el of document.querySelectorAll('.drag-ghost')) el.remove();
    ghost = null;
  }
  function onPointerMove(e) {
    // ドラッグの絵だけが残っている（押していないのに絵がある）ときは消す
    if (!press && (ghost || G.drag)) {
      cancelDrag();
      return;
    }
    if (!press || e.pointerId !== press.id) return;
    const R = G.run;
    if (!R || G.state !== 'build') {
      cancelDrag();
      return;
    }
    // マウスのボタンがもう離れている（ウィンドウの外で離した）なら、ドラッグはやめる
    if (e.pointerType === 'mouse' && e.buttons === 0) {
      cancelDrag();
      return;
    }
    if (!press.moved) {
      if (Math.hypot(e.clientX - press.sx, e.clientY - press.sy) < (press.touch ? 12 : 7)) return;
      if (press.kind === 'canvas') {
        press = null; // 空きマスから動かしただけ
        return;
      }
      press.moved = true;
      const f = press.uid != null ? findMachine(press.uid) : null;
      const type = press.kind === 'shop' ? R.shop[press.shop].type : f && f.m.type;
      if (!type) {
        press = null;
        return;
      }
      G.drag = { uid: press.kind === 'shop' ? null : press.uid, type: press.kind === 'shop' ? type : null, rot: null, moved: true };
      R.sel = press.kind === 'shop' ? null : press.uid;
      ghost = document.createElement('div');
      ghost.className = 'drag-ghost';
      ghost.innerHTML = glyphHTML(type) + `<span>${press.kind === 'grid' ? '手持ちに戻す' : ''}</span>`;
      document.body.appendChild(ghost);
      Sfx.click();
      G.dirty = true;
    }
    if (e.cancelable) e.preventDefault();
    moveGhost(e);
    G.hover = rectHas(canvas, e) ? Render.toBoard(e.clientX, e.clientY) : null;
  }
  function onPointerUp(e) {
    if (!press || e.pointerId !== press.id) return;
    const p = press;
    press = null;
    // タッチにはカーソルがないので、指を離したら「置いたときの見え方」を消す（その場に残ると紛らわしい）
    const clearHover = () => {
      if (p.touch) G.hover = null;
    };
    if (!p.moved) {
      if (p.kind === 'canvas' || p.kind === 'grid') tapCell(p.cx, p.cy);
      clearHover();
      return; // 手持ち・ショップのタップは、いつもの click で処理する
    }
    setTimeout(clearHover, 0);
    suppressClick = true;
    setTimeout(() => (suppressClick = false), 0);
    const R = G.run;
    const drag = G.drag;
    G.drag = null;
    dropGhost();
    if (!R || G.state !== 'build' || !drag) return;
    if (rectHas(canvas, e)) {
      const b = Render.toBoard(e.clientX, e.clientY);
      G.hover = b;
      let uid = drag.uid;
      if (p.kind === 'shop') {
        // ショップから盤面へ：買って、そのまま置く
        const res = buyShop(p.shop);
        if (res !== 'ok') {
          Sfx.error();
          banner(res === 'cap' ? '所持の上限です' : 'コイン不足', 'bad');
          R.sel = null;
          G.dirty = true;
          return;
        }
        Sfx.buy();
        uid = R.tray[R.tray.length - 1].uid;
        if (drag.rot != null) R.tray[R.tray.length - 1].rot = drag.rot;
      }
      const res = inBounds(b.cx, b.cy) ? placeAt(uid, b.cx, b.cy, drag.rot) : 'invalid';
      if (res === 'ok') placedFx(uid);
      else if (res !== 'invalid' && res !== 'gate') placeError(res, false);
      else Sfx.error();
      if (res !== 'ok' && p.kind === 'shop') banner('置けなかったので、手持ちに入れました', 'bad');
    } else if (p.kind === 'grid' && rectHas(side, e)) {
      // 盤面から右の欄へ：手持ちに戻す
      R.sel = drag.uid;
      stashSelected();
      Sfx.click();
    }
    R.sel = null;
    G.dirty = true;
  }
  function cancelDrag() {
    press = null;
    if (G.drag) {
      G.drag = null;
      if (G.run) G.run.sel = null;
      G.dirty = true;
    }
    dropGhost();
  }
  // ドラッグ中の大型の機械の向きを変える（R キー）。選んでいるだけのときは、その場で回す
  function rotateHeld() {
    const R = G.run;
    if (!R || G.state !== 'build') return;
    if (G.drag) {
      const f = G.drag.uid != null ? findMachine(G.drag.uid) : null;
      const type = G.drag.type || (f && f.m.type);
      if (!type || cellCount(type) < 2) return;
      const cur = G.drag.rot != null ? G.drag.rot : f ? f.m.rot || 0 : 0;
      G.drag.rot = 1 - cur;
      Sfx.click();
    } else if (R.sel != null) {
      const f = findMachine(R.sel);
      if (!f || cellCount(f.m.type) < 2) return;
      if (rotateMachine(R.sel)) Sfx.click();
      else {
        Sfx.error();
        banner('回すとはみ出すか、ほかの機械と重なります', 'bad');
      }
      infoKey = '';
    }
  }

  function onCanvasDown(e) {
    Sfx.unlock();
    const R = G.run;
    if (!R) return;
    const b = Render.toBoard(e.clientX, e.clientY);
    G.hover = b;
    if (e.button === 2) {
      cancelDrag();
      R.sel = null;
      G.dirty = true;
      return;
    }
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (G.state !== 'build' || !inBounds(b.cx, b.cy)) return;
    const m = machineAt(b.cx, b.cy);
    beginPress(e, { kind: m ? 'grid' : 'canvas', uid: m ? m.uid : null, cx: b.cx, cy: b.cy });
  }
  function onSideDown(e) {
    const R = G.run;
    if (!R || G.state !== 'build' || (e.pointerType === 'mouse' && e.button !== 0)) return;
    Sfx.unlock();
    const t = e.target.closest('[data-tray]');
    if (t) {
      beginPress(e, { kind: 'tray', uid: +t.dataset.tray });
      return;
    }
    const s = e.target.closest('[data-shop]');
    if (s && R.shop[+s.dataset.shop] && !R.shop[+s.dataset.shop].sold) beginPress(e, { kind: 'shop', shop: +s.dataset.shop });
  }
  function setSpeed(s) {
    G.speedMul = s;
    $('btn-speed').textContent = '×' + s;
  }

  function onKey(e) {
    if (e.code === 'Space') {
      e.preventDefault();
      if (overlay.classList.contains('hidden')) doStart();
    } else if (e.key === 'Escape') {
      cancelDrag();
      if (G.run) {
        G.run.sel = null;
        G.dirty = true;
      }
    } else if (e.key === 'r' || e.key === 'R') {
      rotateHeld();
    } else if (e.key === '1') setSpeed(1);
    else if (e.key === '2') setSpeed(2);
    else if (e.key === '3') setSpeed(4);
  }

  // ---------- 初期化とループ ----------
  function init() {
    side = $('side');
    overlay = $('overlay');
    card = $('overlay-card');
    bannerEl = $('banner');
    canvas = $('board');
    G.meta = loadMeta();
    Render.init(canvas);

    canvas.addEventListener('pointerdown', onCanvasDown);
    canvas.addEventListener('pointermove', (e) => {
      G.hover = Render.toBoard(e.clientX, e.clientY);
    });
    canvas.addEventListener('pointerleave', () => (G.hover = null));
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    side.addEventListener('click', onSideClick);
    side.addEventListener('pointerdown', onSideDown);
    window.addEventListener('pointermove', onPointerMove, { passive: false });
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', (e) => {
      if (press && e.pointerId === press.id) cancelDrag();
    });
    // ドラッグを終えた直後の click は無視する（手持ちの選択が切り替わったりしないように）
    document.addEventListener('click', (e) => {
      if (suppressClick) {
        e.stopPropagation();
        e.preventDefault();
      }
    }, true);
    // 機械の詳細ポップアップ（右の欄の上に重ねる）
    const pop = document.createElement('div');
    pop.id = 'info-pop';
    pop.className = 'info info-pop hidden';
    document.body.appendChild(pop);
    pop.addEventListener('click', onSideClick);
    // 手持ちの機械にカーソルを合わせると詳細を出す（マウスだけ。タッチにはカーソルがないので、タップで選んだときに出す）
    side.addEventListener('pointerover', (e) => {
      if (e.pointerType !== 'mouse') return;
      const t = e.target.closest('[data-tray]');
      hoverTray = t ? +t.dataset.tray : null;
    });
    side.addEventListener('pointerleave', () => (hoverTray = null));
    // ウィンドウから離れた・タブを切り替えたときは、ドラッグ中のものを片付ける
    window.addEventListener('blur', () => cancelDrag());
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) cancelDrag();
    });
    card.addEventListener('click', onOverlayClick);
    $('coach').addEventListener('click', onCoachClick);
    window.addEventListener('keydown', onKey);
    window.addEventListener('resize', () => Render.resize());
    if (window.ResizeObserver) new ResizeObserver(() => Render.resize()).observe(canvas.parentElement);
    $('btn-speed').addEventListener('click', () => setSpeed(G.speedMul === 1 ? 2 : G.speedMul === 2 ? 4 : 1));
    $('btn-mute').addEventListener('click', () => {
      const m = Sfx.toggle();
      $('btn-mute').textContent = m ? '×' : '♪';
    });
    $('btn-menu').addEventListener('click', () => {
      if (!G.run || G.state === 'over' || G.state === 'title' || G.state === 'result') return;
      G.pausedFrom = G.state;
      G.state = 'paused';
      showPause();
    });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => Render.resize());

    showTitle();
    let last = performance.now();
    function loop(t) {
      const dt = Math.min(0.05, (t - last) / 1000);
      last = t;
      update(dt);
      // 準備画面でなくなったら（稼働開始・タイトルへ戻る など）、ドラッグ中のものを片付ける
      if (G.state !== 'build' && (press || ghost || G.drag)) cancelDrag();
      if (G.dirty) {
        G.dirty = false;
        renderSide();
      } else {
        renderInfo(false); // 準備・稼働中以外ではポップアップを隠す
      }
      updateHUD();
      Render.draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }

  return { init, banner, showResult, showGameOver, renderSide, achievement };
})();

window.addEventListener('DOMContentLoaded', UI.init);

</script>
</body>
</html>
